# One-off: remove the old proxied CNAME kathaaya -> www so the Worker custom domain can be attached.
name: dns-fix
on: { push: { branches: ["e2e/dns-fix"] } }
permissions: { contents: read }
jobs:
  fix:
    runs-on: ubuntu-24.04
    env: { CF_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
    steps:
      - run: |
          H="Authorization: Bearer $CF_API_TOKEN"
          Z=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones?name=getbyterush.com" | jq -r '.result[0].id // empty'); echo "zone: ${Z:-NOT FOUND}"
          [ -n "$Z" ] || { curl -s -H "$H" https://api.cloudflare.com/client/v4/user/tokens/verify | jq -c '{success,errors}'; exit 1; }
          R=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/zones/$Z/dns_records?name=kathaaya.getbyterush.com")
          echo "$R" | jq -c '.result[]|{id,type,name,content}'
          for id in $(echo "$R" | jq -r '.result[]|select(.type=="CNAME" and .name=="kathaaya.getbyterush.com")|.id'); do curl -s -X DELETE -H "$H" "https://api.cloudflare.com/client/v4/zones/$Z/dns_records/$id" | jq -c '{success,errors}'; done
