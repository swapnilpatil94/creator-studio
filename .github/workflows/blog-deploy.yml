# Builds the Astro blog (approved posts; future-dated ones are left out until their time) plus the carousel JPEGs Instagram fetches,
# and deploys to Cloudflare (Workers static assets) at kathaaya.getbyterush.com. The cron rebuild is what publishes scheduled posts.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: blog-deploy
on:
  push: { branches: [main, "e2e/**"], paths: ["site/**", "content/items/**", "content/art/**", "tools/content/**", ".github/workflows/blog-deploy.yml"] }   # a blog post committed from the Hub (content/items) rebuilds and deploys on the spot
  schedule: [{ cron: "7 * * * *" }]   # hourly: a post with a future publish time goes live within the hour (was every 3 hours)
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: blog-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: "site/package-lock.json" }
      - run: npm ci --prefix site
      - run: node tools/content/to-mdx.mjs
      - run: npm run build --prefix site
      - name: Verify SEO and Google News markup of the built site (stops the deploy if a page or sitemap is invalid)
        run: node site/scripts/verify-seo.mjs
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
      - name: Tell IndexNow search engines (Bing, Yandex...) about new and updated posts
        continue-on-error: true
        run: node tools/content/indexnow.mjs
