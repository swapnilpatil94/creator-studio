# 06:00 IST: snapshot Facebook/Instagram performance (for the slot A/B test) and refresh the topic outlier data; commits to the `data` branch so main stays clean.
name: daily-research
on:
  schedule: [{ cron: "30 0 * * *" }]
  push:
    branches: ["e2e/**"]   # test hook: pushing a branch named e2e/<anything> runs this workflow from that branch (manual dispatch only works from main)
  workflow_dispatch:
permissions: { contents: write }
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: node tools/content/insights.mjs
      - name: Commit snapshot to the data branch
        run: |
          git config user.name "kathaaya-bot"; git config user.email "bot@users.noreply.github.com"
          git fetch origin data || true
          if git rev-parse --verify -q origin/data >/dev/null; then git checkout -B data origin/data; else git checkout -B data; fi
          git add analytics && (git diff --cached --quiet || git commit -m "analytics $(date -u +%F)") && git push origin data
