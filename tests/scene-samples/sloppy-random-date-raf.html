<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05070c}canvas{display:block}</style></head><body><canvas id="c" width="540" height="960"></canvas><script>
const c=document.getElementById("c"),g=c.getContext("2d");const stars=[];for(let i=0;i<150;i++)stars.push({x:Math.random()*540,y:Math.random()*960,s:Math.random()*2+0.5});
function draw(t){g.fillStyle="#05070c";g.fillRect(0,0,540,960);stars.forEach(s=>{g.fillStyle="rgba(255,255,255,"+(0.4+0.4*Math.sin(t*2+s.x))+")";g.beginPath();g.arc(s.x,(s.y+t*30)%960,s.s,0,6.28);g.fill()});g.fillStyle="#f4b65e";g.beginPath();g.arc(270+Math.sin(Date.now()/500)*100+(Math.random()-0.5)*4,480,20,0,6.28);g.fill()}
const t0=performance.now();function loop(){draw((performance.now()-t0)/1000);requestAnimationFrame(loop)}requestAnimationFrame(loop);
window.getDuration=()=>24;window.renderAt=t=>draw(t);
</script></body></html>
