<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATHAAYA Hub</title>
<style>
:root{--bg:#0f0d0b;--card:#1a1612;--line:#2f271f;--fg:#ecdfc2;--dim:#9a8a6a;--gold:#d4a94a;--red:#a53a2f;--ok:#4f9d69;--warn:#d0a23a;--bad:#c4503f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header b{color:var(--gold);letter-spacing:.14em;margin-right:8px}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:1px solid var(--line);color:var(--fg);padding:6px 11px;border-radius:7px;cursor:pointer}nav button.on{background:var(--gold);color:#1a1209;border-color:var(--gold);font-weight:700}
main{padding:16px;max-width:1280px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}h2{margin:0 0 8px;font-size:16px;color:var(--gold)}h3{margin:12px 0 6px;font-size:14px}
.mut{color:var(--dim);font-size:12.5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button.p,button.s,button.d{border:0;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600}button.p{background:var(--gold);color:#1a1209}button.s{background:#2b2218;color:var(--fg);border:1px solid var(--line)}button.d{background:var(--bad);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
textarea,input,select{background:#120f0c;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px;font:inherit;width:100%}textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);margin:1px}.ok{color:var(--ok);border-color:var(--ok)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}.gold{color:var(--gold);border-color:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:600;font-size:12px}
.day{display:grid;grid-template-columns:96px 1fr;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:178px;cursor:pointer;background:#16120e}.slot:hover{border-color:var(--gold)}.slot.empty{border-style:dashed;color:var(--dim)}.slot.scheduled{border-color:#6c8fb5}.slot.posted{border-color:var(--ok)}.slot.failed{border-color:var(--bad)}
.thumbs{display:flex;gap:6px;overflow:auto;padding:4px 0}.thumbs img{height:170px;border-radius:6px;border:1px solid var(--line)}
pre{background:#120f0c;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;font-size:12px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto}
@media(max-width:700px){.day{grid-template-columns:1fr}}
</style></head><body>
<header><b>KATHAAYA HUB</b><nav id="nav"></nav><span class="grow"></span><span id="sys" class="mut"></span></header><main id="view">Loading…</main><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j}
const TABS=[['today','Today'],['content','Content'],['newvideo','New video'],['create','Create'],['reels','Carousel → Video'],['publish','Publish'],['plan','Plan (30 days)'],['topics','Topics'],['blog','Blog'],['system','System']];
let TAB=(location.hash||'#today').slice(1),S=null,PLAN=[],CUR=null,JOB=null,BRIEF='';
const KIND={fb_text:'FB text',carousel:'Carousel',reel:'Reel / Short',fb_long:'FB long video',yt_long:'YouTube long'};
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===TAB?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){TAB=t;location.hash=t;load()}
async function loadToday(){try{TODAYD=await api('/api/hub/today')}catch{TODAYD=null}render()}
async function load(){loadToday();try{[S,PLAN]=await Promise.all([api('/api/hub/state'),api('/api/hub/plan?days=30').then(x=>x.slots)])}catch(e){$('#view').innerHTML='<div class="card bad">'+esc(e.message)+'</div>';return}
 const c=S.comfy;$('#sys').innerHTML=`Flux: <span class="chip ${c.alive?'ok':c.starting?'warn':''}">${c.alive?'on':c.starting?'starting…':'off (starts by itself)'}</span> ${c.rendering?'<span class="chip warn">render running</span>':''}`;nav();render()}
function render(){const v={today:vToday,content:vContent,newvideo:vNewVideo,plan:vPlan,topics:vTopics,create:vCreate,reels:vReels,publish:vPublish,blog:vBlog,system:vSystem}[TAB]||vPlan;$('#view').innerHTML=bannerHtml()+v()}
const stChip=s=>`<span class="chip ${({ready:'ok',posted:'ok',scheduled:'gold',approved:'ok','needs images':'warn','needs review':'warn','fix QA':'bad',failed:'bad',empty:'',rendered:'warn',packaged:'warn',voiced:'warn',scripted:'warn',idea:''})[s]||''}">${esc(s)}</span>`;
// ---------- PLAN ----------
function inventory(){const inv={};for(const k of Object.keys(KIND))inv[k]={ready:0,work:0};for(const i of S.items){const k=i.format==='fb_text'?'fb_text':i.format==='carousel'?'carousel':null;if(!k)continue;const used=S.schedule.some(e=>e.item===i.id&&e.status!=='failed');if(i.state==='ready'&&!used)inv[k].ready++;else if(!used&&i.state!=='ready')inv[k].work++}for(const st of S.stories){const k=st.format==='long'?'fb_long':'reel';if(['approved','packaged'].includes(st.state))inv[k].ready++;else if(st.state!=='posted')inv[k].work++}return inv}
function vPlan(){const days={};for(const s of PLAN)(days[s.date]=days[s.date]||[]).push(s);const cnt={empty:0,scheduled:0,posted:0,failed:0};PLAN.forEach(s=>cnt[s.status]=(cnt[s.status]||0)+1);const inv=inventory(),need={};PLAN.filter(s=>s.status==='empty').forEach(s=>need[s.kind]=(need[s.kind]||0)+1);
 return `<div class="card"><h2>The month at a glance</h2><div class="row"><span class="chip">${PLAN.length} slots</span><span class="chip bad">${cnt.empty} empty</span><span class="chip gold">${cnt.scheduled} scheduled</span><span class="chip ok">${cnt.posted} posted</span><span class="chip bad">${cnt.failed||0} failed</span></div>
 <h3>What must get ready (empty slots vs items you have)</h3><table><tr><th>Format</th><th>Empty slots</th><th>Ready, unscheduled</th><th>In progress</th><th>Gap</th></tr>${Object.keys(KIND).map(k=>{const n=need[k]||0,r=inv[k].ready,g=Math.max(0,n-r);return `<tr><td>${KIND[k]}</td><td>${n}</td><td>${r}</td><td>${inv[k].work}</td><td>${g?`<span class="chip bad">${g} to make</span>`:'<span class="chip ok">covered</span>'}</td></tr>`}).join('')}</table>
 <div class="mut" style="margin-top:6px">Slots come from content/calendar.json (an IST hypothesis to test for 4 weeks). Click a slot to assign or post.</div></div>
 <div class="card">${Object.entries(days).map(([d,sl])=>`<div class="day"><div><b>${d}</b><div class="mut">${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</div></div><div class="slots">${sl.map(s=>`<div class="slot ${s.status}" onclick='slotOpen(${JSON.stringify(s).replace(/'/g,"&#39;")})'><b>${s.time}</b> ${KIND[s.kind]} ${stChip(s.status)}<div class="mut">${esc(s.label||'')}</div><div>${s.platforms.map(p=>`<span class="chip">${p.slice(0,2).toUpperCase()}</span>`).join('')}</div></div>`).join('')}</div></div>`).join('')}</div>`}
function slotOpen(s){const items=S.items.filter(i=>((s.kind==='fb_text'&&i.format==='fb_text')||(s.kind==='carousel'&&i.format==='carousel')));const used=id=>S.schedule.some(e=>e.item===id&&e.status!=='failed');const stor=S.stories.filter(x=>(s.kind==='reel'&&x.format==='short')||(['fb_long','yt_long'].includes(s.kind)&&x.format==='long'));
 let h=`<h2>${KIND[s.kind]}, ${s.date} ${s.time} IST</h2><div class="mut">${s.platforms.join(' + ')}</div>`;
 if(s.status==='empty'){h+=`<h3>Assign</h3><select id="as"><option value="">choose…</option>${items.filter(i=>!used(i.id)).map(i=>`<option value="item:${i.id}" ${i.state!=='ready'?'disabled':''}>${esc(i.hook||i.id)} [${i.state}]</option>`).join('')}${stor.map(x=>`<option value="story:${x.name}">${esc(x.title)} [${x.state}]</option>`).join('')}</select><div class="row" style="margin-top:8px"><button class="p" onclick='assign(${JSON.stringify(s)})'>Schedule it</button><button class="s" onclick="goCreate()">Create something for this slot</button><button class="s" onclick="closeM()">Close</button></div><div class="mut" style="margin-top:6px">Only approved, QA-clean items (with all images) can be scheduled. A queued item is posted by GitHub Actions at the time (or by <code>node tools/content/post-due.mjs</code>).</div>`}
 else{h+=`<p>${stChip(s.status)} <b>${esc(s.label||'')}</b></p>${s.entry?`<div class="row"><button class="s" onclick="unsched('${s.entry}')">Remove from schedule</button><button class="d" onclick="postNow('${s.entry}')">Post now…</button><button class="s" onclick="closeM()">Close</button></div>`:'<button class="s" onclick="closeM()">Close</button>'}`}
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
async function assign(s){const v=$('#as').value;if(!v)return alert('choose an item');const i=v.indexOf(':'),t=v.slice(0,i),id=v.slice(i+1);try{await api('/api/hub/schedule',t==='item'?{item:id,kind:s.kind,at:s.at}:{story:id,kind:s.kind,at:s.at});closeM();load()}catch(e){alert(e.message)}}
async function unsched(id){await api('/api/hub/unschedule',{id});closeM();load()}
async function postNow(id){if(!confirm('Post this to the live accounts right now?'))return;try{const r=await api('/api/hub/post-now',{id,confirm:true});alert(r.out+'\n\nstatus: '+r.entry.status+(r.entry.error?' - '+r.entry.error:''));closeM();load()}catch(e){alert(e.message)}}
function goCreate(){closeM();go('create')}
// ---------- TOPICS ----------
function vTopics(){const T=S.topics;if(!OUT&&!OUTBUSY){OUTBUSY=1;api('/api/hub/outliers').then(x=>{OUT=x;OUTBUSY=0;render()}).catch(()=>{OUTBUSY=0})}return outlierCard()+`<div class="card"><h2>Add topics</h2><div class="mut">One per line: <code>title | formats (comma) | pillar | english search words</code> (only the title is required). The English words pull real source passages for the brief.</div><textarea id="timp" rows="5" placeholder="गंगा ने सात पुत्रों को क्यों बहाया? | fb_text,carousel,blog | unsaid-relations | Ganga Shantanu eight children Vasus curse"></textarea><div style="margin-top:6px"><button class="p" onclick="impTopics()">Add to the topic bank</button></div></div>
 <div class="card"><h2>Topic bank (${T.length})</h2><table><tr><th>Topic</th><th>Pillar</th><th>Status</th><th>Sensitivity</th><th>Brief for a frontier model</th></tr>${T.map(t=>`<tr><td>${esc(t.title)}<div class="mut">${esc(t.slug)}${t.query?' · '+esc(t.query):''}</div>${t.note?`<div class="mut">${esc(t.note)}</div>`:''}</td><td>${esc(t.pillar)}</td><td>${stChip(t.status)}</td><td>${stChip(t.sensitivity)}</td><td>${t.sensitivity==='hold'?'<span class="mut">on hold by policy</span>':['carousel','fb_text','blog'].map(f=>`<button class="s" onclick="brief('${t.slug}','${f}')">${f}</button>`).join(' ')}</td></tr>`).join('')}</table></div>
 <div class="card" id="briefbox" style="display:${BRIEF?'block':'none'}"><h2>Prompt to paste into Claude / GPT / Gemini</h2><div class="mut">It already contains our writing rules and the real source passages. Paste the model's answer into <b>Create</b>.</div><textarea id="briefta" rows="14" readonly>${esc(BRIEF)}</textarea><div style="margin-top:6px"><button class="p" onclick="cp('briefta')">Copy</button> <button class="s" onclick="go('create')">Go to Create</button></div></div>`}
let OUT=null,OUTBUSY=0,TODAYD=null,MDOPEN=false;
function bannerHtml(){const t=TODAYD;if(!t||!t.tasks.length||TAB==='today')return '';const u=t.tasks.filter(x=>x.priority==='blocker'||x.priority==='overdue').length;return '<div class="card" style="border-color:var(--bad,#d9573f);cursor:pointer" onclick="go(\'today\')"><b style="color:var(--bad,#d9573f)">'+esc(t.banner)+'</b> <span class="mut">'+(u?u+' urgent. ':'')+'Click to open today\'s list.</span></div>'}
function vToday(){const t=TODAYD;if(!t)return '<div class="card">Loading today\'s list…</div>';let h='<div class="card"><h2>Today ('+esc(t.date)+'): what the studio needs from you</h2><div style="font-size:18px;margin:6px 0"><b>'+esc(t.banner)+'</b></div><div class="mut">The producer agent checks every slot for the next 4 days, the festival deadlines, the approvals waiting and the video queue. A task only disappears when the thing it asks for exists, so it keeps coming back until you do it. It also posts this list as a GitHub issue each morning (phone notification).</div><div class="row" style="margin-top:8px"><button class="p" onclick="runAgent()">Let the agent do its safe steps now (queue topics, schedule approved items, refresh data)</button></div>'+(t.doneByAgent.length?'<div class="mut" style="margin-top:6px">Done by the agent: '+t.doneByAgent.map(esc).join('; ')+'</div>':'')+'</div>';for(const k of t.tasks){const col={blocker:'bad',overdue:'bad',today:'warn',soon:''}[k.priority];h+='<div class="card"><div class="row"><span class="chip '+col+'">'+esc(k.priority)+'</span><b>'+esc(k.title)+'</b><span class="grow"></span><button class="s" onclick="go(\''+k.tab+'\')">Open '+esc(k.tab)+'</button></div><div class="mut" style="margin:4px 0">'+esc(k.why)+(k.ageHours?' (open for '+k.ageHours+' h)':'')+'</div>'+(k.input?'<div><b>You provide:</b> '+esc(k.input.what)+(k.input.topic?' — topic: <b>'+esc(k.input.topic)+'</b>':'')+'</div>'+(k.input.prompt?'<textarea id="ap'+esc(k.id).replace(/[^a-z0-9]/gi,'')+'" rows="4" readonly>'+esc(k.input.prompt)+'</textarea><button class="s" onclick="cp(\'ap'+esc(k.id).replace(/[^a-z0-9]/gi,'')+'\')">Copy prompt for my frontier model</button>':''):'')+'</div>'}return h}
async function runAgent(){try{TODAYD=await api('/api/hub/today/run',{});render()}catch(e){alert(e.message)}}
function outRows(title,rows,cols){if(!rows||!rows.length)return '<h3>'+title+'</h3><div class="mut">no data</div>';return '<h3>'+title+'</h3><table><tr><th>#</th><th>Topic</th>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'<th>Festival → publish by</th></tr>'+rows.map((r,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(r.topic)+'</b></td>'+cols.map(c=>'<td>'+esc(String(c[1](r)))+'</td>').join('')+'<td>'+(r.event?esc(r.event.name+' '+r.event.date+' → '+r.publishBy):'')+'</td></tr>').join('')+'</table>'}
let OUTPILLAR='mythology-india';
function outlierCard(){const o=OUT,t=o&&o.topics;let h='<div class="card"><h2>Outlier Topic Engine: what KATHAAYA should make next, across the whole brand</h2><div class="mut">Not restricted to one god or one genre: Indian mythology, world mythology, psychology and dark psychology are researched as separate pillars. Query lists are expanded every run with Google\'s real autocomplete suggestions, so the topics are genuinely discovered, not a fixed list. Runs by itself on GitHub (monthly on the 25th and weekly on Mondays), stored on the <code>data</code> branch.</div><div class="row" style="margin-top:8px">';if(o){h+='<select id="outm" onchange="outLoad(this.value)">'+o.months.map(m=>'<option '+(m===o.month?'selected':'')+'>'+m+'</option>').join('')+'</select>'}h+='<button class="p" onclick="outRun()">Run now (a few minutes, uses YouTube quota)</button><button class="s" onclick="outPull()">Pull latest from GitHub</button><button class="s" onclick="outQueue()">Add top 20 across the brand to my topics</button>'+(o&&o.md?'<button class="s" onclick="MDOPEN=!MDOPEN;render()">'+(MDOPEN?'Hide':'Show')+' full report (.md)</button>':'')+'<span class="mut">'+(o&&o.running?'running…':'')+(o&&o.dataBranchLastUpdate?' GitHub data branch updated '+esc(o.dataBranchLastUpdate):' (data branch: nothing yet)')+'</span></div>';if(o&&o.runLog&&o.runLog.length)h+='<pre style="max-height:90px;overflow:auto">'+esc(o.runLog.join('\n'))+'</pre>';if(o&&o.md&&MDOPEN)h+='<div class="mut" style="margin-top:8px">This is the readable write-up the engine generates every run (topics.md), same numbers as the tables below in prose -- what each score basis means, and why each topic ranked where it did.</div><pre style="max-height:480px;overflow:auto;white-space:pre-wrap;margin-top:6px">'+esc(o.md)+'</pre>';if(!t)return h+'<div class="mut" style="margin-top:8px">'+(o?'No outlier data yet. Click Run now.':'Loading…')+'</div></div>';
 h+='<div class="mut" style="margin-top:6px">Month '+t.month+', generated '+esc(t.generated.slice(0,16))+'</div>';
 if(t.brand_overview&&t.brand_overview.length)h+='<h3>This week, across every pillar</h3><table><tr><th>#</th><th>Topic</th><th>Pillar</th><th>Score</th></tr>'+t.brand_overview.slice(0,12).map((r,i)=>'<tr><td>'+(i+1)+'</td><td><b>'+esc(r.topic)+'</b></td><td class="mut">'+esc(r.pillarLabel||r.pillar||'')+'</td><td>'+r.score+'</td></tr>').join('')+'</table>';
 if(t.trending_now_india&&t.trending_now_india.length)h+='<div class="mut" style="margin-top:6px"><b>Trending in India right now</b> (Google Trends, cross-referenced into the scores above): '+t.trending_now_india.slice(0,8).map(x=>esc(x.title)).join(', ')+'</div>';
 const pillars=t.pillars||{};if(!pillars[OUTPILLAR])OUTPILLAR=Object.keys(pillars)[0];
 h+='<div class="row" style="margin-top:10px">'+Object.entries(pillars).map(([pid,p])=>'<button class="'+(OUTPILLAR===pid?'p':'s')+'" onclick="OUTPILLAR=\''+pid+'\';render()">'+esc(p.label.split(' (')[0])+'</button>').join('')+'</div>';
 const pl=pillars[OUTPILLAR];
 if(pl){h+='<div class="mut" style="margin-top:6px">Researched this run: '+esc(pl.queries.join(', '))+'</div>';
  h+=outRows('YouTube long-form',pl.platforms.youtube_long,[['views/day',r=>r.medViewsPerDay],['views per sub',r=>r.medViewsPerSub],['score',r=>r.score]]);
  h+=outRows('YouTube Shorts',pl.platforms.youtube_short,[['views/day',r=>r.medViewsPerDay],['views per sub',r=>r.medViewsPerSub],['score',r=>r.score]]);
  h+=outRows('Instagram (competitor outliers)',pl.platforms.instagram,[['posts',r=>r.matchingPosts],['outliers',r=>r.outlierPosts],['score',r=>r.score]]);
  h+=outRows('Facebook (PROXY)',pl.platforms.facebook,[['score',r=>r.score],['format',r=>r.suggestedFormat]]);
  if(pl.festival_plan&&pl.festival_plan.length)h+='<h3>Festival deadlines</h3><table><tr><th>Festival</th><th>Date (±days)</th><th>Topics</th></tr>'+pl.festival_plan.map(f=>'<tr><td>'+esc(f.event)+'</td><td>'+f.date+' ±'+f.uncertainDays+'</td><td>'+esc(f.topics.join(' / '))+'</td></tr>').join('')+'</table>';
 }
 if(t.errors&&t.errors.length)h+='<div class="mut" style="color:var(--warn)">Problems: '+esc(t.errors.join('; '))+'</div>';
 return h+'</div>'}
async function outLoad(m){OUT=await api('/api/hub/outliers?month='+m);render()}
async function outRun(){try{await api('/api/hub/outliers/run',{});alert('Started. It takes about 2 minutes; this page refreshes when it is done.');const iv=setInterval(async()=>{OUT=await api('/api/hub/outliers');render();if(!OUT.running)clearInterval(iv)},4000)}catch(e){alert(e.message)}}
async function outPull(){try{await api('/api/hub/outliers/pull',{});OUT=null;render();alert('Pulled the latest result from the GitHub data branch.')}catch(e){alert(e.message)}}
async function outQueue(){try{const r=await api('/api/hub/outliers/queue',{month:OUT.month,n:3});alert(r.added+' topic(s) added to your topics list');load()}catch(e){alert(e.message)}}

// ---------- NEW VIDEO: strict prompt -> paste the pack -> check -> make -> watch ----------
let NV={topic:'',format:'short',source:'',prompt:'',text:'',chk:null,id:null,list:null,poll:null,busy:false};
function nvChips(a,cls){return a.map(x=>'<span class="chip '+cls+'" style="margin:2px">'+esc(x)+'</span>').join('')}
function vNewVideo(){
 if(!NV.list&&!NV.busy){NV.busy=true;api('/api/hub/videos').then(r=>{NV.list=r.videos;NV.busy=false;if(TAB==='newvideo')render()}).catch(()=>{NV.busy=false})}
 const c=NV.chk,st=NV.st;
 let h='<div class="card"><h2>New video: no carousel needed</h2><div class="mut">Three steps. <b>1</b> tell the studio the topic and get the strict prompt (it lists every flag the code understands). <b>2</b> give the prompt to your frontier model (Claude, GPT, Gemini) and paste its answer. <b>3</b> check it, then click Make. The system voices it, paints the pictures (your prompts first, the local model for the rest), plans every scene, renders, checks and packages the video, and you watch the steps below.</div>';
 h+='<div class="row" style="margin-top:8px"><input id="nvtopic" placeholder="Topic, e.g. कर्ण ने कवच क्यों दान किया?" style="min-width:340px" value="'+esc(NV.topic)+'" oninput="NV.topic=this.value"><select id="nvfmt" onchange="NV.format=this.value;NV.prompt=\'\';render()"><option value="short" '+(NV.format==='short'?'selected':'')+'>Short (vertical 9:16, 45 s to 3 min)</option><option value="long" '+(NV.format==='long'?'selected':'')+'>Long (horizontal 16:9, 3 to 12 min, chapters)</option></select><button class="p" onclick="nvPrompt()">Get the strict prompt</button></div>';
 h+='<textarea id="nvsrc" rows="3" style="margin-top:6px" placeholder="Optional: paste source passages or facts the model must stay inside (recommended: the exact scripture lines)" oninput="NV.source=this.value">'+esc(NV.source)+'</textarea>';
 if(NV.prompt)h+='<div style="margin-top:8px"><b>Prompt for your frontier model</b> <span class="mut">(copy it all; it already contains the topic, the format rules, every allowed effect, backdrop, style and limit)</span><textarea id="nvprompt" rows="12" readonly>'+esc(NV.prompt)+'</textarea><div style="margin-top:6px"><button class="p" onclick="cp(\'nvprompt\')">Copy prompt</button></div></div>';
 h+='</div>';
 h+='<div class="card"><h2>2. Paste the answer</h2><textarea id="nvpaste" rows="14" placeholder="FORMAT: short\nSLUG: ...\nTITLE: ...\nNARRATION:\n1 | [hook] ..." oninput="NV.text=this.value">'+esc(NV.text)+'</textarea><div class="row" style="margin-top:6px"><button class="s" onclick="nvCheck()">Check it</button><button class="p" '+(c&&c.ok&&!NV.id?'':'disabled')+' onclick="nvMake()">Make the video</button><span class="mut">'+(c?(c.ok?'ready':'fix the red items first'):'check first')+'</span></div>';
 if(c){h+='<div style="margin-top:8px"><span class="chip '+(c.ok?'ok':'bad')+'">'+(c.ok?'accepted':'rejected')+'</span> <b>'+c.stats.beats+'</b> beats, <b>'+c.stats.words+'</b> words (about '+Math.floor(c.stats.est_seconds/60)+' min '+(c.stats.est_seconds%60)+' s of speech), '+c.stats.chapters+' chapters, <b>'+c.stats.scenes+'</b> picture prompts from you, <b>'+c.stats.visuals+'</b> visual directions, format '+esc(c.stats.format)+'. Estimated machine time: <b>about '+c.estimate_minutes+' minutes</b> with the built-in voice, <b>about '+c.estimate_minutes_own_voice+' minutes</b> if you upload your own narration audio.</div>';
  if(c.ok)h+='<div class="card" style="margin-top:8px"><b>Voice (optional, saves the most time)</b><div class="mut">The built-in Chatterbox voice speaks at about 1/6 of real time (a 10-minute film needs about an hour). If you have the narration as an audio file from any voice tool (ElevenLabs, Google, OpenAI, a person), upload it here: the studio aligns your lines to the audio (about 1 minute per 5 minutes of audio) and skips the synthesis. Read the lines in order with a clear pause between lines.</div><div class="row" style="margin-top:6px"><input type="file" id="nvvoice" accept="audio/*" onchange="nvVoice(this)"><span id="nvvoicest" class="mut">'+(c.voice?'<span class="chip ok">your audio is attached</span>':'no audio attached: the built-in voice will be used')+'</span></div></div>';
  if(c.errors.length)h+='<div style="margin-top:6px;color:var(--bad,#d9573f)">'+c.errors.map(e=>'✗ '+esc(e)).join('<br>')+'</div>';
  if(c.warnings.length)h+='<div style="margin-top:6px;color:var(--warn,#e0a040)">'+c.warnings.slice(0,12).map(e=>'! '+esc(e)).join('<br>')+'</div>';
  if(c.similar&&c.similar.length)h+='<div class="card" style="margin-top:8px;border-color:var(--warn,#e0a040)"><b>This looks similar to content you already have</b><div class="mut">Same story again risks repeating yourself. If this is genuinely a different angle, ignore this.</div><ul>'+c.similar.map(s=>'<li>'+esc(s.title)+' <span class="mut">('+esc(s.kind)+', '+s.overlap+' words in common)</span></li>').join('')+'</ul></div>';
  if(Object.keys(c.look||{}).length)h+='<div class="mut" style="margin-top:6px">Look you fixed: '+esc(JSON.stringify(c.look))+' (anything you left out is chosen by the system, uniquely for this film)</div>';
  h+='<details style="margin-top:6px"><summary>What the system read, beat by beat</summary><table><tr><th>#</th><th>intent</th><th>words</th><th>your picture prompt</th><th>your visual flags</th><th>line</th></tr>'+c.beats.map(b=>'<tr><td>'+b.n+(b.chapter?' <span class="chip gold">'+esc(b.chapter)+'</span>':'')+'</td><td>'+esc(b.intent||'auto')+'</td><td>'+b.words+'</td><td>'+(b.scene?'yes':'')+'</td><td>'+(b.visual?esc(Object.entries(b.visual).map(([k,v])=>k+'='+v).join(' ')):'')+'</td><td>'+esc(b.text)+'</td></tr>').join('')+'</table></details>'}
 h+='</div>';

 if(NV.id&&NV.st&&NV.st.timing&&NV.st.timing.ended&&!NV.st.timing.failed)h+=nvThumbCard();

 h+='<div class="card"><h2>Your video packs</h2>'+(NV.list&&NV.list.length?'<table><tr><th>Video</th><th>Format</th><th>Status</th><th></th></tr>'+NV.list.map(v=>'<tr><td><b>'+esc(v.title)+'</b><div class="mut">'+esc(v.id)+'</div></td><td>'+esc(v.format)+'</td><td>'+(v.mp4?'<span class="chip ok">made</span> '+(v.duration?Math.floor(v.duration/60)+':'+String(v.duration%60).padStart(2,'0'):'')+(v.total_seconds?' in '+Math.round(v.total_seconds/60)+' min':''):v.failed?'<span class="chip bad">failed at '+esc(v.failed)+'</span>':'<span class="chip warn">not made</span>')+'</td><td>'+(v.mp4?'<button class="s" onclick="nvShow(\''+esc(v.id)+'\')">Watch</button>':'')+'</td></tr>').join('')+'</table>':'<div class="mut">None yet.</div>')+'</div>';
 return h}
function nvTimingCard(){const T=NV.timings;if(!T&&!NV.tbusy){NV.tbusy=true;api('/api/hub/video/timings').then(r=>{NV.timings=r;NV.tbusy=false;if(TAB==='newvideo')render()}).catch(()=>{NV.tbusy=false})}if(!T)return '';const mm=s=>s>=3600?Math.floor(s/3600)+' h '+Math.round(s%3600/60)+' min':Math.round(s/60)+' min';const avg=(k,l)=>{const a=T.average[k];return a?'<tr><td><b>'+l+'</b></td><td>'+a.runs+'</td><td>'+Math.floor(a.speech/60)+':'+String(a.speech%60).padStart(2,'0')+'</td><td><b>'+mm(a.total)+'</b></td><td class="mut">'+Object.entries(a.stages).filter(([k,v])=>v>0).map(([k,v])=>esc(k)+' '+mm(v)).join(' · ')+'</td></tr>':'<tr><td><b>'+l+'</b></td><td colspan="4" class="mut">no finished run yet</td></tr>'};return '<div class="card"><h2>How long a video takes (measured on this Mac)</h2><div class="mut">Every step is timed. The thumbnail (its own Flux painting) is the last step before packaging. Cached steps count as 0.</div><table><tr><th>Format</th><th>Runs</th><th>Avg speech</th><th>Avg total, script to thumbnail and package</th><th>Where the time goes</th></tr>'+avg('short','Short (vertical)')+avg('long','Long (horizontal)')+'</table><details style="margin-top:6px"><summary>Each run</summary><table><tr><th>Video</th><th>Format</th><th>Speech</th><th>Total</th><th>Steps</th></tr>'+T.runs.map(r=>'<tr><td>'+esc(r.name)+'</td><td>'+r.format+'</td><td>'+(r.speech?Math.floor(r.speech/60)+':'+String(r.speech%60).padStart(2,'0'):'')+'</td><td>'+mm(r.total)+'</td><td class="mut">'+Object.entries(r.stages).filter(([k,v])=>v>0).map(([k,v])=>esc(k)+' '+(v>=60?Math.round(v/60)+'m':v+'s')).join(' · ')+'</td></tr>').join('')+'</table></details></div>'}
function nvThumbCard(){const v=NV.st||{},t=NV.th||{};const mk=(id,ph,val)=>'<input id="'+id+'" placeholder="'+ph+'" value="'+esc(val||'')+'" oninput="NV.th=NV.th||{};NV.th.'+id+'=this.value" style="min-width:230px">';return '<div class="card"><h2>Thumbnail studio</h2><div class="mut">Own Flux painting for this story in one of five palettes, a 2-3 line question on brush strokes with a red ?, made for '+(NV.fmt==='long'?'YouTube/Facebook long (16:9)':'Shorts/Reels (9:16)')+'. Leave a field empty and the system derives it from the narration. Generating takes about 1-2 minutes.</div><div class="row" style="margin-top:8px">'+mk('thead','Headline question (Hindi, ends with ?)',t.thead)+mk('tsup','Small ribbon line (optional)',t.tsup)+'<select id="tstyle" onchange="NV.th=NV.th||{};NV.th.tstyle=this.value"><option value="">palette: automatic</option>'+[['gold','Gold & Obsidian: warriors, gods, epic'],['red','Red & Charcoal: betrayal, war, tragedy'],['teal','Teal & Gold: secrets, curses, mysteries'],['purple','Purple & Gold: cosmic, avatars'],['parchment','Parchment & Ink: explainers, source-based']].map(([k,l])=>'<option value="'+k+'" '+(t.tstyle===k?'selected':'')+'>'+l+'</option>').join('')+'</select></div><div class="row" style="margin-top:6px">'+mk('tart','Art: subject | emotion | symbol | backdrop (English, <= 8 words each)',t.tart).replace('min-width:230px','min-width:700px')+'<button class="p" onclick="nvThumb()">Generate thumbnail with Flux</button></div><div class="row" style="margin-top:8px;align-items:flex-start">'+(v.cover?'<div><div class="mut">Current</div><img src="'+v.cover+'?'+Date.now()+'" style="'+(NV.fmt==='long'?'width:420px':'width:170px')+';border-radius:8px"></div>':'')+'</div></div>'}
async function nvThumb(){const t=NV.th||{};try{await api('/api/hub/thumb/make',{id:NV.id,headline:t.thead,support:t.tsup,style:t.tstyle,art:t.tart});alert('Generating (1-2 minutes). The page refreshes when it is done.');setTimeout(()=>{nvPoll();NV.list=null;render()},90000)}catch(e){alert(e.message)}}
function nvProgress(){const st=NV.st;if(!st)return '<div class="mut">starting…</div>';let h='';const t=st.timing;if(t&&t.stages){const tot=t.total_seconds||0;h+='<div><b>'+(t.ended?(t.failed?'stopped at '+esc(t.failed):'done'):'running')+'</b> · '+Math.floor(tot/60)+' min '+(tot%60)+' s so far</div><table><tr><th>Step</th><th>Status</th><th>Time</th><th>Detail</th></tr>'+t.stages.map(s=>'<tr><td>'+esc(s.name)+'</td><td><span class="chip '+({done:'ok',cached:'ok',running:'warn',failed:'bad'}[s.status]||'')+'">'+esc(s.status)+'</span></td><td>'+(s.seconds!=null?s.seconds+' s':'')+'</td><td class="mut">'+esc(String(s.detail||'').slice(0,100))+'</td></tr>').join('')+'</table>'}
 if(NV.log&&NV.log.length)h+='<pre style="max-height:110px;overflow:auto">'+esc(NV.log.slice(-6).join('\n'))+'</pre>';
 if(st.mp4)h+='<h3>Final video</h3><div class="row" style="align-items:flex-start"><video src="'+st.mp4+'?'+Date.now()+'" controls style="'+(NV.fmt==='long'?'width:560px':'width:300px')+';border-radius:10px;border:1px solid var(--line)"></video>'+(st.cover?'<div><div class="mut">Thumbnail</div><img src="'+st.cover+'?'+Date.now()+'" style="width:170px;border-radius:8px"></div>':'')+'<div class="mut">One full-quality file (no preview copy). Publish it from the Facebook / Instagram / YouTube tabs or the dashboard.</div></div>';return h}
async function nvVoice(el){const f=el.files[0];if(!f)return;const ext=(f.name.split('.').pop()||'wav').toLowerCase();$('#nvvoicest').textContent='uploading '+Math.round(f.size/1e5)/10+' MB…';try{const r=await fetch('/api/hub/pack/voice?slug='+encodeURIComponent(NV.chk.slug)+'&ext='+ext,{method:'POST',body:f});const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);NV.chk.voice=true;$('#nvvoicest').innerHTML='<span class="chip ok">attached: '+esc(j.saved)+' ('+j.mb+' MB)</span>'}catch(e){$('#nvvoicest').textContent='upload failed: '+e.message}}
async function nvPrompt(){if(!NV.topic.trim())return alert('Write the topic first');try{const r=await api('/api/hub/pack/prompt?topic='+encodeURIComponent(NV.topic)+'&format='+NV.format+'&source='+encodeURIComponent(NV.source));NV.prompt=r.prompt;render()}catch(e){alert(e.message)}}

function nvShow(id){NV.id=id;NV.st=null;nvPoll();render()}
async function nvPoll(){clearInterval(NV.poll);const tick=async()=>{if(!NV.id)return;try{NV.st=await api('/api/hub/video/status?id='+encodeURIComponent(NV.id));const j=(await api('/api/hub/jobs')).jobs[0];NV.log=j&&j.status==='running'?j.log:[];if(TAB==='newvideo'){const y=window.scrollY;render();window.scrollTo(0,y)}if(NV.st&&NV.st.timing&&NV.st.timing.ended){clearInterval(NV.poll);NV.list=null}}catch(e){}};await tick();NV.poll=setInterval(tick,5000)}
async function impTopics(){try{const r=await api('/api/hub/topics/import',{text:$('#timp').value});alert(r.added+' topic(s) added');load()}catch(e){alert(e.message)}}
async function brief(slug,format){try{BRIEF=(await api('/api/hub/topic/brief',{slug,format})).prompt;render();$('#briefbox').scrollIntoView()}catch(e){alert(e.message)}}

let PASTE='',ITEM=null,STATE=null;
function vCreate(){const ex=S.items.map(i=>`<option value="${i.id}" ${CUR===i.id?'selected':''}>${esc(i.id)} [${i.state}]</option>`).join('');
 return `<div class="card"><h2>1. Paste what the frontier model gave you</h2><div class="row"><select id="open" style="max-width:340px" onchange="openItem(this.value)"><option value="">…or open a saved item</option>${ex}</select><span class="mut">Labelled text (FORMAT / SLUG / HOOK / SLIDES n | text | image prompt / CLAIMS …) or JSON. The exact prompt is on the Topics tab.</span></div><textarea id="paste" rows="9" style="margin-top:8px" oninput="PASTE=this.value">${esc(PASTE)}</textarea><div style="margin-top:6px"><button class="p" onclick="readPaste()">Read it and check</button></div></div>${ITEM?vItem():''}`}
function qaList(q){return q.filter(x=>x.level!=='PASS').map(x=>`<div><span class="chip ${x.level==='FAIL'?'bad':'warn'}">${x.level}</span> <b>${esc(x.code)}</b> ${esc(x.msg)}</div>`).join('')||'<span class="chip ok">QA clean</span>'}
function vItem(){const it=ITEM,st=STATE,art=it.art||[],bust=Date.now(),slides=it.slides||[];
 return `<div class="card"><h2>2. ${esc(it.id)} ${stChip(st.state)} <span class="chip">${st.art.have}/${st.art.need} images</span></h2><div><b>${esc(it.hook||it.title||'')}</b></div><div style="margin:6px 0">${qaList(st.qa)}</div>
 <div class="row"><button class="s" onclick="saveItem()">Save as draft (content/items + content/art, the story folder)</button>${art.length?`<button class="p" onclick="genArt()">Generate images with Flux (starts it if needed)</button>`:''}${it.format==='carousel'?`<button class="s" onclick="renderCar()">Render carousel</button>`:''}</div>
 <div id="jobbox"></div>
 ${it.format==='carousel'?`<h3>Slides</h3><table>${slides.map((t,i)=>{const sh=art.find(a=>a.slide===i+1);return `<tr><td style="width:150px">${sh?`<img src="/hub/file/${it.slug}/art/${String(i+1).padStart(2,'0')}.jpg?${bust}" style="height:150px;border-radius:6px;border:1px solid var(--line)" onerror="this.style.display='none'">`:'<span class="mut">text only</span>'}</td><td><b>${i+1}.</b> ${esc(t)}${sh?`<div class="mut">${esc((sh.prompt||[sh.subject,sh.action,sh.setting,sh.lighting].join(', ')).slice(0,320))}</div><button class="s" onclick="redo(${i+1})">Redo this image</button>`:''}</td></tr>`}).join('')}</table>
 <h3>Rendered preview</h3><div class="thumbs">${slides.map((t,i)=>`<img src="/hub/file/${it.slug}/out/${String(i+1).padStart(2,'0')}.jpg?${bust}" onerror="this.style.display='none'">`).join('')}</div>`:`<h3>Text</h3><pre>${esc([it.hook,...(it.body_lines||[]),it.cta,it.source_line,(it.hashtags||[]).join(' ')].filter(Boolean).join('\n'))}</pre>`}
 <h3>3. Approve and schedule</h3><div class="row"><button class="p" ${st.fails||st.state==='needs images'?'disabled':''} onclick="approve(true)">I checked it: approve</button><button class="s" onclick="approve(false)">Back to draft</button><button class="s" onclick="makePublic(false)" title="Instagram downloads carousel slides from a public address">Make slides public (needed for Instagram)</button><button class="s" onclick="makePublic(true)">Check if public</button><span id="pubres" class="mut"></span><span class="mut">Checklist: source read, variants named, no mockery, hook keeps its promise, CTA is a question or save, Devanagari correct, AI pictures looked at.</span></div>

function vReel(){const r=RS;if(!r||r.error)return '<div class="card"><h2>Reel (75-90 s)</h2><div class="mut">Loading…</div></div>';

 const step=(ok,l)=>`<span class="chip ${ok?'ok':''}">${ok?'✓ ':''}${l}</span>`;
 return `<div class="card"><h2>Autopilot: one click, the studio does the rest</h2><div class="mut">Writer model (${'local Ollama, or Anthropic if a key is set'}) drafts a sourced carousel and the reel narration, QA-checks and repairs it; then Flux makes the pictures, and the studio renders the carousel and the stippled reel. Nothing is typed by hand. Posting still waits for your approval.</div>
 <div class="row" style="margin-top:8px"><input id="apslug" class="grow" placeholder="Topic (leave empty = next topic from the bank${r&&r.next_topic?': '+esc(r.next_topic):''})"><input id="apnote" class="grow" placeholder="Optional guidance, e.g. keep it under the Navratri frame"><button class="p" onclick="autopilot()">Run Autopilot</button></div>
 <div class="mut" style="margin-top:6px">Takes about 1 to 1.5 hours of Mac time (drafting, 10 pictures, voice, render). One job at a time; Flux starts and stops by itself.</div></div><div id="jobbox"></div>
 <div class="card"><h2>How a video is made: what you give, what the studio decides</h2>
 <div class="mut"><b>You give 1 thing (2 optional):</b>
 <ol style="margin:6px 0 6px 18px;padding:0">
 <li><b>The narration script (required).</b> One spoken line per row, Devanagari Hindi, about 30 to 40 lines (380 to 480 words = 3 minutes). Line 1 is the hook question, the last lines are your close. Use only facts from your source. Mark one punch word per line with <code>*stars*</code> if you want to choose it yourself; otherwise the studio picks.</li>
 <li><i>Optional:</i> a carousel for the same story. Its paintings are reused and its source line and claims travel with the video. Without it the studio paints its own scenes from your script.</li>
 <li><i>Optional:</i> your own picture for a scene (drop it in the story's assets); otherwise it is generated.</li></ol>
 <b>You never give:</b> image prompts, effects, camera moves, music, colours, captions.<br>
 <b>How the visuals are decided (automatic, different for every video):</b>
 <ul style="margin:6px 0 6px 18px;padding:0">
 <li><b>Look:</b> palette, caption style (pop / box / karaoke), Instagram grade (film / teal / dream / light-leak) and transition are picked from the story and mood, and never repeat the last films.</li>
 <li><b>Director:</b> reads each line, decides what it is (hook, shock, fact, list, number, quote, turn) and picks one of the picture-with-camera, kinetic type, number, bars, timeline, icon list or dot-word scenes, plus one of the 30 strict effects. Rules: no effect three times in a row, at least 5 scene types a minute, text scenes hide the subtitle.</li>
 <li><b>Pictures:</b> the writer model turns each line into a scene description, Draw Things paints it (about 40 s each), an OCR guard redoes any picture with lettering, depth and cut-out layers keep faces and hands rigid.</li>
 <li><b>Life:</b> embers, leaves, petals, mist, water and rays come from the words in the line; Lottie stickers, hand-drawn marks (rough.js), GSAP easing and a unique Ken Burns per scene are added automatically.</li></ul>
 <b>Time for one 3-minute video:</b> about 35 to 45 minutes on this Mac (voice about 14 min, paintings about 13 min if all new, depth layers and camera about 7 min, render about 2 min, checks 1 min). The table below shows the real time of each step after every run.<br>
 <b>Steps:</b> 1 pick the carousel, 2 get the prompt, 3 paste it into your frontier model, 4 paste its script below, 5 Check, 6 Make the video, 7 watch the progress, 8 approve and publish from the Publish tab.</div></div>
 <div class="card"><h2>3-minute video: paste the script, the studio makes everything else</h2><div class="mut">1. Pick a carousel. 2. <b>Get the prompt</b>, give it to your frontier model (Claude, GPT, Gemini) and paste its answer below (one spoken line per row). 3. <b>Check</b>, then <b>Make the video</b>. The studio then voices it, plans every visual, paints what the carousel does not cover, builds depth and camera moves, renders, checks and times each step. Leave the box empty and the studio writes the script itself with its local model (weaker Hindi).</div>
 <div class="row" style="margin-top:8px"><select id="vid" style="max-width:380px">${r?r.reels.map(x=>`<option value="${x.id}" ${VSEL===x.id?'selected':''}>${esc(x.id)} ${x.video&&x.video.mp4?'(video exists)':''}</option>`).join(''):''}</select><button class="s" onclick="vbrief()">Get the prompt for my frontier model</button></div>
 <div id="vbriefbox" style="display:none;margin-top:8px"><textarea id="vbriefta" rows="10" readonly></textarea><div style="margin-top:6px"><button class="p" onclick="cp('vbriefta')">Copy prompt</button></div></div>
 <textarea id="vscript" rows="9" style="margin-top:8px" placeholder="Paste the script here: one spoken thought per line, Devanagari Hindi"></textarea>
 <div class="row" style="margin-top:6px"><button class="s" onclick="vcheck()">Check the script</button><button class="p" onclick="vmake()">Make the video</button><span id="vresult" class="mut"></span></div></div>
 <div class="card"><h2>Languages: the studio translates the blog for the world</h2><div class="mut">Hindi is the source. The writer model translates each approved post and the site text; the site then serves it at /en/, /mr/ and so on, with hreflang and a "machine translated" label. Local models are best at English, then Spanish, Portuguese, Indonesian, Marathi; Tamil, Telugu, Bengali and Gujarati need an Anthropic key for good quality.</div><div class="row" style="margin-top:8px">${[["en","English"],["mr","मराठी"],["es","Español"],["pt","Português"],["id","Indonesia"],["bn","বাংলা"],["ta","தமிழ்"],["te","తెలుగు"],["gu","ગુજરાતી"]].map(([c,n])=>`<label class="chip"><input type="checkbox" class="lg" value="${c}" style="width:auto"> ${n}</label>`).join("")}<button class="p" onclick="translateNow()">Translate all approved posts</button></div></div>
 <div class="card"><h2>Carousels and their videos</h2>${!r?'Loading…':`<table><tr><th>Carousel</th><th>Steps</th><th>Video</th><th></th></tr>${r.reels.map(x=>`<tr><td><b>${esc(x.hook||x.slug)}</b><div class="mut">${esc(x.id)} ${stChip(x.status||'draft')}</div></td><td>${step(x.art.need===0||x.art.have>=x.art.need,'images '+x.art.have+'/'+x.art.need)}${step(x.narration,'narration')}${step(x.steps.voice,'voice')}${step(x.steps.video,'rendered')}${step(x.steps.qa,'QA')}${step(x.steps.packaged,'packaged')}${x.scheduled?'<span class="chip gold">scheduled</span>':''}</td><td>${x.mp4?`<video src="${x.mp4}" controls preload="none" poster="${x.cover||''}" style="height:230px;border-radius:8px"></video>`:'<span class="mut">no reel yet</span>'}${x.video&&x.video.mp4?`<div class="mut" style="margin-top:6px">3-min video (${x.video.duration||'?'} s)</div><video src="${x.video.mp4}" controls preload="none" poster="${x.video.cover||''}" style="height:230px;border-radius:8px"></video>`:''}${x.video&&x.video.timing?`<div class="mut" style="margin-top:6px">${timingHtml(x.video.timing)}</div>`:''}</td><td><button class="s" onclick="reelMake('${x.id}')">${x.mp4?'Rebuild reel':'Make reel (75 s)'}</button> <button class="p" onclick="videoMake('${x.id}')">${x.video&&x.video.mp4?'Rebuild 3-min video':'Make 3-min video'}</button> <button class="s" onclick="openReelItem('${x.id}')">Open</button></td></tr>`).join('')}</table>`}</div>`}
async function autopilot(){const slug=$('#apslug').value.trim(),note=$('#apnote').value.trim();if(!confirm('Start Autopilot'+(slug?' for '+slug:' for the next topic')+'? It uses the Mac for 1 to 1.5 hours.'))return;try{const r=await api('/api/hub/autopilot',{slug,note});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
async function translateNow(){const langs=[...document.querySelectorAll('.lg:checked')].map(x=>x.value);if(!langs.length)return alert('Tick at least one language');if(!confirm('Translate approved posts and the site text into '+langs.join(', ')+'? Runs on the Mac; about 5 to 20 minutes per post and language.'))return;try{let r=await api('/api/hub/translate',{langs,ui:true});JOB=r.job;pollJob();const t=setInterval(async()=>{const j=await api('/api/hub/jobs');if(!j.running){clearInterval(t);try{r=await api('/api/hub/translate',{langs});JOB=r.job;pollJob()}catch(e){alert(e.message)}}},4000)}catch(e){alert(e.message)}}
function timingHtml(t){if(!t||!t.stages)return'';const tot=t.total_seconds||0;return `<b>video build ${Math.floor(tot/60)} min ${tot%60} s${t.ended?'':' (running)'}</b><table>${t.stages.map(s=>`<tr><td>${esc(s.name)}</td><td>${stChip(s.status==='done'||s.status==='cached'?'ready':s.status==='failed'?'failed':'scripted')}</td><td>${s.seconds!=null?Math.floor(s.seconds/60)+'m '+(s.seconds%60)+'s':'…'}</td><td class="mut">${esc((s.detail||'').slice(0,70))}</td></tr>`).join('')}</table>`}
async function videoMake(id){if(!confirm('Make the 3-minute vertical video? The system writes or takes the script, voices it, plans every visual, generates missing pictures, renders and checks it. About 1.5 to 3 hours of Mac time; every stage is timed.'))return;try{const r=await api('/api/hub/video/make',{id,minutes:3});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
let VSEL=null;
async function vbrief(){VSEL=$('#vid').value;try{const r=await api('/api/hub/video/brief?id='+encodeURIComponent(VSEL));$('#vbriefta').value=r.prompt;$('#vbriefbox').style.display='block'}catch(e){alert(e.message)}}
async function vcheck(save){VSEL=$('#vid').value;const t=$('#vscript').value;try{const r=await api('/api/hub/video/script',{id:VSEL,text:t,save:!!save});$('#vresult').innerHTML=`<span class="chip ${r.ok?'ok':'bad'}">${r.beats} lines</span><span class="chip">${r.words} words</span><span class="chip">about ${Math.floor(r.seconds/60)} min ${r.seconds%60} s</span>${r.notes.map(n=>`<div class="chip ${/^QA /.test(n)?'bad':'warn'}">${esc(n)}</div>`).join('')}${r.saved?'<span class="chip ok">script saved</span>':''}`;return r}catch(e){$('#vresult').innerHTML='<span class="chip bad">'+esc(e.message)+'</span>';return null}}
async function vmake(){VSEL=$('#vid').value;const t=$('#vscript').value.trim();if(t){const r=await vcheck(true);if(!r||!r.ok){alert('Fix the script first (red notes).');return}}else if(!confirm('No script pasted: the studio will write one with its local model (weaker Hindi). Continue?'))return;if(!confirm('Make the video now? The Mac is busy for a while; every step is timed below.'))return;try{const r=await api('/api/hub/video/make',{id:VSEL,minutes:3});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
async function reelMake(id){if(!confirm('Make the video for '+id+'? Images, voice, render and QA run by themselves (30 to 60 min).'))return;try{const r=await api('/api/hub/reel/make',{id});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
function pollReels(){let k=0;const t=setInterval(async()=>{if(TAB!=='reels'){clearInterval(t);return}const j=await api('/api/hub/jobs');if(!j.running){clearInterval(t);RL=null;render();return}if(++k%3===0){try{RL=await api('/api/hub/reels');if(!document.querySelector('#jobbox pre')||true){const jb=$('#jobbox').innerHTML;render();$('#jobbox').innerHTML=jb}}catch(e){}}},5000)}
async function openReelItem(id){go('create');setTimeout(()=>{try{openItem(id)}catch{}},400)}
async function runSysCheck(){$('#syscheck').innerHTML='<div class="mut">Running 38 checks (tests, site build, tokens, GitHub). About a minute…</div>';try{SC=(await api('/api/hub/syscheck')).checks}catch(e){$('#syscheck').innerHTML='<span class="chip bad">'+esc(e.message)+'</span>';return}
 const f=SC.filter(x=>x.level==='FAIL'),w=SC.filter(x=>x.level==='WARN');$('#syscheck').innerHTML=`<div class="row"><span class="chip bad">${f.length} fail</span><span class="chip warn">${w.length} warn</span><span class="chip ok">${SC.length-f.length-w.length} ok</span></div><table>${[...f,...w,...SC.filter(x=>x.level==='OK')].map(x=>`<tr><td>${stChip(x.level==='OK'?'ready':x.level==='WARN'?'needs review':'failed')}</td><td>${esc(x.area)}</td><td>${esc(x.check)}</td><td class="mut">${esc(x.detail)}</td></tr>`).join('')}</table>`}
</script></body></html>
