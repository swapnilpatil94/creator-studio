<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATHAAYA Hub</title>
<style>
/* Studio palette: cool neutral surfaces, one warm accent (brand continuity), vivid-but-tasteful status colors. */
:root{--bg:#0a0b0e;--bg2:#0d0e12;--card:#15171c;--card2:#1a1d23;--line:#24272e;--line2:#33363f;--fg:#e9eaee;--dim:#898d98;--gold:#e3b155;--gold-ink:#1a1306;--ok:#3ed48a;--warn:#f0ab3d;--bad:#f2555c;--radius:10px;--shadow:0 1px 2px rgba(0,0,0,.35),0 1px 1px rgba(0,0,0,.2)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 -apple-system,'SF Pro Text',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
header{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg2) 92%,transparent);backdrop-filter:blur(8px);z-index:5;flex-wrap:wrap}
header b{color:var(--fg);letter-spacing:.1em;margin-right:10px;font-weight:700;font-size:13px}header b::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:middle;box-shadow:0 0 8px color-mix(in srgb,var(--gold) 70%,transparent)}
nav{display:flex;gap:3px;flex-wrap:wrap}nav button{background:none;border:1px solid transparent;color:var(--dim);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;transition:color .12s,background .12s}nav button:hover{color:var(--fg);background:var(--card2)}nav button.on{background:var(--card2);color:var(--fg);border-color:var(--line2);font-weight:600}
main{padding:20px;max-width:1280px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
h2{margin:0 0 8px;font-size:15px;font-weight:650;color:var(--fg);letter-spacing:-.01em}h3{margin:14px 0 7px;font-size:13px;font-weight:650;color:var(--fg)}
.mut{color:var(--dim);font-size:12.5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button.p,button.s,button.d{border:0;border-radius:7px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;transition:filter .12s,opacity .12s}
button.p{background:var(--gold);color:var(--gold-ink)}button.p:hover{filter:brightness(1.08)}
button.s{background:var(--card2);color:var(--fg);border:1px solid var(--line2)}button.s:hover{background:color-mix(in srgb,var(--card2) 80%,var(--fg) 6%)}
button.d{background:color-mix(in srgb,var(--bad) 88%,black);color:#fff}button.d:hover{filter:brightness(1.1)}
button:disabled{opacity:.38;cursor:not-allowed;filter:none}
textarea,input,select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit;width:100%;transition:border-color .12s}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line2);margin:1px;color:var(--dim);background:var(--bg2)}
.chip.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line2))}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line2))}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line2))}
.chip.gold{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 45%,var(--line2))}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
.day{display:grid;grid-template-columns:96px 1fr;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:178px;cursor:pointer;background:var(--bg2);transition:border-color .12s}.slot:hover{border-color:var(--gold)}.slot.empty{border-style:dashed;color:var(--dim)}.slot.scheduled{border-color:#6c8fb5}.slot.posted{border-color:var(--ok)}.slot.failed{border-color:var(--bad)}
.thumbs{display:flex;gap:6px;overflow:auto;padding:4px 0}.thumbs img{height:170px;border-radius:7px;border:1px solid var(--line)}
pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;font-size:12px;color:var(--dim)}
.modal{position:fixed;inset:0;background:rgba(5,6,8,.72);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:20}.modal>div{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:18px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
@media(max-width:700px){.day{grid-template-columns:1fr}}
.spin{display:inline-block;width:11px;height:11px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-1.5px;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:16px;bottom:16px;z-index:40;display:flex;flex-direction:column-reverse;gap:8px;max-width:360px;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--dim);border-radius:9px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);animation:toastIn .18s ease-out}
.toast.ok{border-left-color:var(--ok)}.toast.bad{border-left-color:var(--bad)}
@keyframes toastIn{from{transform:translateY(6px);opacity:0}to{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:1.2s}.toast{animation:none}}
</style></head><body>
<header><b>KATHAAYA HUB</b><nav id="nav"></nav><span class="grow"></span><span id="sys" class="mut"></span><button class="s" title="Storage, limits, system checks" onclick="go('system')" style="padding:6px 10px">⚙</button></header><main id="view">Loading…</main><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j}
// a result toast, not a blocking alert() -- for "it worked" / "it failed" after an action, never for a yes/no decision (confirm() stays for those)
let TOASTS=[];
function toast(msg,kind='ok'){const id=Math.random();TOASTS.push({id,msg,kind});renderToasts();setTimeout(()=>{TOASTS=TOASTS.filter(t=>t.id!==id);renderToasts()},5000)}
function renderToasts(){let el=document.getElementById('toasts');if(!el){el=document.createElement('div');el.id='toasts';document.body.appendChild(el)}el.innerHTML=TOASTS.map(t=>`<div class="toast ${t.kind}">${esc(t.msg)}</div>`).join('')}
// 5 top-level destinations, not 10: research says tabs stop working past ~5, and three different "make
// something" tabs (New video / Create / Carousel -> Video) that only differ in HOW you start was exactly
// the kind of tool-shaped-not-task-shaped navigation that made this hard to learn. Create is now one page
// with a mode switcher; Output absorbs the old flat Content list; System moves to the gear icon (header) --
// storage/limits/checks are a "need it rarely" page, not a daily destination.
const TABS=[['create','Create'],['week','Week (7 days)'],['publish','Library'],['plan','Plan (30 days)'],['topics','Topics'],['blog','Blog']];
let TAB=(location.hash||'#create').slice(1),S=null,PLAN=[],CUR=null,JOB=null,BRIEF='';
const KIND={fb_text:'FB text',carousel:'Carousel',reel:'Reel / Short',fb_long:'FB long video',yt_long:'YouTube long'};
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===TAB?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){TAB=t;location.hash=t;load()}
async function loadToday(){try{TODAYD=await api('/api/hub/today')}catch{TODAYD=null}render()}
async function load(){loadToday();try{[S,PLAN]=await Promise.all([api('/api/hub/state'),api('/api/hub/plan?days=30').then(x=>x.slots)])}catch(e){$('#view').innerHTML='<div class="card bad">'+esc(e.message)+'</div>';return}
 const c=S.comfy;$('#sys').innerHTML=`Flux: <span class="chip ${c.alive?'ok':c.starting?'warn':''}">${c.alive?'on':c.starting?'starting…':'off (starts by itself)'}</span> ${c.rendering?'<span class="chip warn">render running</span>':''}`;nav();render()}
// 'today'/'newvideo'/'reels'/'content' are not nav buttons any more, but old links (the producer agent's
// task.tab, bookmarks, muscle memory) still point at them -- keep them resolving to where that content
// actually lives now instead of a dead tab. Same for 'facebook'/'youtube'/'instagram': tools/agent/daily.mjs
// still emits those as a task's tab (left over from the old per-platform pages); they mean "go publish it".
function render(){const v={create:vCreateHub,today:vCreateHub,newvideo:vCreateHub,reels:vCreateHub,plan:vPlan,week:vWeek,topics:vTopics,publish:vPublish,content:vPublish,facebook:vPublish,instagram:vPublish,youtube:vPublish,blog:vBlog,system:vSystem}[TAB]||vCreateHub;$('#view').innerHTML=bannerHtml()+v()}
const stChip=s=>`<span class="chip ${({ready:'ok',posted:'ok',scheduled:'gold',approved:'ok','needs images':'warn','needs review':'warn','fix QA':'bad',failed:'bad',empty:'',rendered:'warn',packaged:'warn',voiced:'warn',scripted:'warn',idea:''})[s]||''}">${esc(s)}</span>`;
// ---------- PLAN ----------
function inventory(){const inv={};for(const k of Object.keys(KIND))inv[k]={ready:0,work:0};for(const i of S.items){const k=i.format==='fb_text'?'fb_text':i.format==='carousel'?'carousel':null;if(!k)continue;const used=S.schedule.some(e=>e.item===i.id&&e.status!=='failed');if(i.state==='ready'&&!used)inv[k].ready++;else if(!used&&i.state!=='ready')inv[k].work++}for(const st of S.stories){const k=st.format==='long'?'fb_long':'reel';if(['approved','packaged'].includes(st.state))inv[k].ready++;else if(st.state!=='posted')inv[k].work++}return inv}
function vPlan(){const days={};for(const s of PLAN)(days[s.date]=days[s.date]||[]).push(s);const cnt={empty:0,scheduled:0,posted:0,failed:0};PLAN.forEach(s=>cnt[s.status]=(cnt[s.status]||0)+1);const inv=inventory(),need={};PLAN.filter(s=>s.status==='empty').forEach(s=>need[s.kind]=(need[s.kind]||0)+1);
 return `<div class="card"><h2>The month at a glance</h2><div class="row"><span class="chip">${PLAN.length} slots</span><span class="chip bad">${cnt.empty} empty</span><span class="chip gold">${cnt.scheduled} scheduled</span><span class="chip ok">${cnt.posted} posted</span><span class="chip bad">${cnt.failed||0} failed</span></div>
 <h3>What must get ready (empty slots vs items you have)</h3><table><tr><th>Format</th><th>Empty slots</th><th>Ready, unscheduled</th><th>In progress</th><th>Gap</th></tr>${Object.keys(KIND).map(k=>{const n=need[k]||0,r=inv[k].ready,g=Math.max(0,n-r);return `<tr><td>${KIND[k]}</td><td>${n}</td><td>${r}</td><td>${inv[k].work}</td><td>${g?`<span class="chip bad">${g} to make</span>`:'<span class="chip ok">covered</span>'}</td></tr>`}).join('')}</table>
 <div class="mut" style="margin-top:6px">Slots come from content/calendar.json (an IST hypothesis to test for 4 weeks). Click a slot to assign or post.</div></div>
 <div class="card">${Object.entries(days).map(([d,sl])=>`<div class="day"><div><b>${d}</b><div class="mut">${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</div></div><div class="slots">${sl.map(s=>`<div class="slot ${s.status}" onclick='slotOpen(${JSON.stringify(s).replace(/'/g,"&#39;")})'><b>${s.time}</b> ${KIND[s.kind]} ${stChip(s.status)}<div class="mut">${esc(s.label||'')}</div><div>${s.platforms.map(p=>`<span class="chip">${p.slice(0,2).toUpperCase()}</span>`).join('')}</div></div>`).join('')}</div></div>`).join('')}</div>`}
function slotOpen(s){const items=S.items.filter(i=>((s.kind==='fb_text'&&i.format==='fb_text')||(s.kind==='carousel'&&i.format==='carousel')));const used=id=>S.schedule.some(e=>e.item===id&&e.status!=='failed');const stor=S.stories.filter(x=>(s.kind==='reel'&&x.format==='short')||(['fb_long','yt_long'].includes(s.kind)&&x.format==='long'));
 let h=`<h2>${KIND[s.kind]}, ${s.date} ${s.time} IST</h2><div class="mut">${s.platforms.join(' + ')}</div>`;
 if(s.status==='empty'){h+=`<h3>Assign</h3><select id="as"><option value="">choose…</option>${items.filter(i=>!used(i.id)).map(i=>`<option value="item:${i.id}" ${i.state!=='ready'?'disabled':''}>${esc(i.hook||i.id)} [${i.state}]</option>`).join('')}${stor.map(x=>`<option value="story:${x.name}">${esc(x.title)} [${x.state}]</option>`).join('')}</select><div class="row" style="margin-top:8px"><button class="p" onclick='assign(${JSON.stringify(s)})'>Schedule it</button><button class="s" onclick="goCreate()">Create something for this slot</button><button class="s" onclick="closeM()">Close</button></div><div class="mut" style="margin-top:6px">Only approved, QA-clean items (with all images) can be scheduled. A queued item is posted by GitHub Actions at the time (or by <code>node tools/content/post-due.mjs</code>).</div>`}
 else{h+=`<p>${stChip(s.status)} <b>${esc(s.label||'')}</b></p>${s.entry?`<div class="row"><button class="s" onclick="unsched('${s.entry}')">Remove from schedule</button><button class="d" onclick="postNow('${s.entry}')">Post now…</button><button class="s" onclick="closeM()">Close</button></div>`:'<button class="s" onclick="closeM()">Close</button>'}`}
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
async function assign(s){const v=$('#as').value;if(!v)return alert('choose an item');const i=v.indexOf(':'),t=v.slice(0,i),id=v.slice(i+1);try{await api('/api/hub/schedule',t==='item'?{item:id,kind:s.kind,at:s.at}:{story:id,kind:s.kind,at:s.at});closeM();load()}catch(e){alert(e.message)}}
async function unsched(id){await api('/api/hub/unschedule',{id});closeM();load()}
async function postNow(id){if(!confirm('Post this to the live accounts right now?'))return;try{const r=await api('/api/hub/post-now',{id,confirm:true});alert(r.out+'\n\nstatus: '+r.entry.status+(r.entry.error?' - '+r.entry.error:''));closeM();load()}catch(e){alert(e.message)}}
function goCreate(){closeM();go('create')}
// ---------- TOPICS ----------
function vTopics(){const T=S.topics;if(!OUT&&!OUTBUSY){OUTBUSY=1;api('/api/hub/outliers').then(x=>{OUT=x;OUTBUSY=0;render()}).catch(()=>{OUTBUSY=0})}if(!CAL&&!CALBUSY){CALBUSY=1;api('/api/hub/calendar').then(x=>{CAL=x;CALBUSY=0;render()}).catch(()=>{CALBUSY=0})}return calendarCard()+outlierCard()+`<div class="card"><h2>Add topics</h2><div class="mut">One per line: <code>title | formats (comma) | pillar | english search words</code> (only the title is required). The English words pull real source passages for the brief.</div><textarea id="timp" rows="5" placeholder="गंगा ने सात पुत्रों को क्यों बहाया? | fb_text,carousel,blog | unsaid-relations | Ganga Shantanu eight children Vasus curse"></textarea><div style="margin-top:6px"><button class="p" onclick="impTopics()">Add to the topic bank</button></div></div>
 <div class="card"><h2>Topic bank (${T.length})</h2><table><tr><th>Topic</th><th>Pillar</th><th>Status</th><th>Sensitivity</th><th>Brief for a frontier model</th></tr>${T.map(t=>`<tr><td>${esc(t.title)}<div class="mut">${esc(t.slug)}${t.query?' · '+esc(t.query):''}</div>${t.note?`<div class="mut">${esc(t.note)}</div>`:''}</td><td>${esc(t.pillar)}</td><td>${stChip(t.status)}</td><td>${stChip(t.sensitivity)}</td><td>${t.sensitivity==='hold'?'<span class="mut">on hold by policy</span>':['carousel','fb_text','blog'].map(f=>`<button class="s" onclick="brief('${t.slug}','${f}')">${f}</button>`).join(' ')}</td></tr>`).join('')}</table></div>
 <div class="card" id="briefbox" style="display:${BRIEF?'block':'none'}"><h2>Prompt to paste into Claude / GPT / Gemini</h2><div class="mut">It already contains our writing rules and the real source passages. Paste the model's answer into <b>Create</b>.</div><textarea id="briefta" rows="14" readonly>${esc(BRIEF)}</textarea><div style="margin-top:6px"><button class="p" onclick="cp('briefta')">Copy</button> <button class="s" onclick="go('create')">Go to Create</button></div></div>`}
let OUT=null,OUTBUSY=0,TODAYD=null,MDOPEN=false;
let CAL=null,CALBUSY=0,CALMDOPEN=false;
function bannerHtml(){const t=TODAYD;if(!t||!t.tasks.length||TAB==='create')return '';const u=t.tasks.filter(x=>x.priority==='blocker'||x.priority==='overdue').length;return '<div class="card" style="border-color:var(--bad,#d9573f);cursor:pointer" onclick="go(\'create\')"><b style="color:var(--bad,#d9573f)">'+esc(t.banner)+'</b> <span class="mut">'+(u?u+' urgent. ':'')+'Click to open what needs you.</span></div>'}
// topics ranked for Today: a festival deadline wins, soonest first; everything else keeps the order they were added (newest research first)
function topicRank(){if(!S)return [];return (S.topics||[]).filter(x=>x.status!=='done'&&x.status!=='posted'&&x.sensitivity!=='hold').map((x,i)=>({x,i})).sort((a,b)=>{const ea=a.x.event,eb=b.x.event,da=ea&&(ea.publishBy||ea.date),db=eb&&(eb.publishBy||eb.date);if(da&&db)return da<db?-1:1;if(da)return -1;if(db)return 1;return b.i-a.i}).map(o=>o.x)}
function topicStart(slug){const t=(S.topics||[]).find(x=>x.slug===slug);if(!t)return;NV.topic=t.title;NV.source='';NV.prompt='';go('newvideo');nvPrompt()}
function vTopicsToday(){const list=topicRank().slice(0,8);if(!list.length)return '';return '<div class="card"><h2>Topics ready to make</h2><div class="mut">Pick one: you get the prompt for your frontier model, paste its answer back, and Generate. Once it is done you publish it right here, per platform.</div><table style="margin-top:8px"><tr><th>Topic</th><th>Pillar</th><th></th></tr>'+list.map(x=>'<tr><td><b>'+esc(x.title)+'</b>'+(x.event?'<div class="mut">'+esc(x.event.name+' → '+x.event.publishBy)+'</div>':'')+'</td><td class="mut">'+esc(x.pillar||'')+'</td><td><button class="p" onclick="topicStart(\''+esc(x.slug)+'\')">Start</button></td></tr>').join('')+'</table><div class="mut" style="margin-top:6px">'+list.length+' waiting · full list and adding new topics: <a href="#" onclick="go(\'topics\');return false" style="color:var(--gold)">Topics tab</a></div></div>'}
const TABLABEL={create:'Create',plan:'Plan',topics:'Topics',publish:'Library',content:'Library',facebook:'Library',instagram:'Library',youtube:'Library',blog:'Blog',system:'System'};
// the producer agent's own task list (festival deadlines, empty slots, finished videos waiting to post) --
// no topic list here, that's vTopicsToday()'s job; vCreateHub composes the two so they show once, not twice.
function vTaskList(){const t=TODAYD;if(!t)return '<div class="card">Loading…</div>';if(!t.tasks.length&&!t.banner)return '';let h='<div class="card"><h2>What needs you ('+esc(t.date)+')</h2><div style="font-size:16px;margin:6px 0"><b>'+esc(t.banner)+'</b></div><div class="mut">Checked against the next 4 days, festival deadlines, approvals waiting and the video queue. A task disappears once the thing it asks for exists.</div><div class="row" style="margin-top:8px"><button class="p" onclick="runAgent()">Let the agent do its safe steps now (queue topics, schedule approved items, refresh data)</button></div>'+(t.doneByAgent.length?'<div class="mut" style="margin-top:6px">Done by the agent: '+t.doneByAgent.map(esc).join('; ')+'</div>':'')+'</div>';for(const k of t.tasks){const col={blocker:'bad',overdue:'bad',today:'warn',soon:''}[k.priority];h+='<div class="card"><div class="row"><span class="chip '+col+'">'+esc(k.priority)+'</span><b>'+esc(k.title)+'</b><span class="grow"></span><button class="s" onclick="go(\''+k.tab+'\')">Open '+esc(TABLABEL[k.tab]||k.tab)+'</button></div><div class="mut" style="margin:4px 0">'+esc(k.why)+(k.ageHours?' (open for '+k.ageHours+' h)':'')+'</div>'+(k.input?'<div><b>You provide:</b> '+esc(k.input.what)+(k.input.topic?' — topic: <b>'+esc(k.input.topic)+'</b>':'')+'</div>'+(k.input.prompt?'<textarea id="ap'+esc(k.id).replace(/[^a-z0-9]/gi,'')+'" rows="4" readonly>'+esc(k.input.prompt)+'</textarea><button class="s" onclick="cp(\'ap'+esc(k.id).replace(/[^a-z0-9]/gi,'')+'\')">Copy prompt for my frontier model</button>':''):'')+'</div>'}return h}
let CREATEMODE='topic';
function vCreateHub(){const modes=[['topic','From a topic'],['paste','Paste what I have'],['autopilot','Autopilot from a carousel']];
 const switcher='<div class="card"><div class="mut" style="margin-bottom:8px">Three ways to start something new:</div><div class="row">'+modes.map(([k,l])=>'<button class="'+(CREATEMODE===k?'p':'s')+'" onclick="CREATEMODE=\''+k+'\';render()">'+esc(l)+'</button>').join('')+'</div></div>';
 const body=CREATEMODE==='paste'?vCreate():CREATEMODE==='autopilot'?vReels():vTopicsToday()+vNewVideo();
 return vTaskList()+switcher+body}

let PUBBUSY={};
function topicEventFor(title){if(!title)return null;const t=(S.topics||[]).find(x=>x.event&&(x.title===title||title.includes(x.title)||x.title.includes(title)));return t&&t.event||null}
function fmtDate(iso){try{return new Date(iso).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch{return iso}}
// the owner's own posting-time hypothesis (content/calendar.json, documented there: an A/B of 11:00 vs 19:00
// text slots against real Meta/YouTube Insights, not a generic "best time to post" number) -- "Suggest" in
// the scheduler just finds the next slot of the right kind, the same math hub.mjs's own planner uses.
function istParts(d){const t=new Date(d.getTime()+5.5*3600000);return{y:t.getUTCFullYear(),m:t.getUTCMonth()+1,day:t.getUTCDate(),dow:['sun','mon','tue','wed','thu','fri','sat'][t.getUTCDay()]}}
function nextSlotFor(kind){if(!S.calendar)return null;for(let i=0;i<14;i++){const p=istParts(new Date(Date.now()+i*864e5)),slots=(S.calendar.slots[p.dow]||[]).filter(s=>s.kind===kind);for(const sl of slots){const at=new Date(`${p.y}-${String(p.m).padStart(2,'0')}-${String(p.day).padStart(2,'0')}T${sl.time}:00+05:30`);if(at.getTime()>Date.now()+15*60000)return at}}return null}
function slotKindFor(story,pl){if(story.format==='long')return pl==='youtube'?'yt_long':'fb_long';return'reel'}
function toLocalInputValue(d){const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function suggestTime(name,pl){const story=(S.stories||[]).find(s=>s.name===name),at=nextSlotFor(story?slotKindFor(story,pl):'reel');if(!at)return;const el=document.getElementById('dt_'+(name+':'+pl).replace(/[^a-z0-9]/gi,'_'));if(el)el.value=toLocalInputValue(at)}
function platChip(state,when){return state==='posted'?'<span class="chip ok">posted ✓</span>':state==='blocked'?'<span class="chip bad">needs attention</span>':state==='failed'?'<span class="chip bad">failed, retrying</span>':state==='scheduled'?`<span class="chip gold">scheduled${when?' · '+esc(fmtDate(when)):''}</span>`:state==='queued'?'<span class="chip gold">queued</span>':''}
// a story's facebook/instagram post can be recorded in two places: social-upload.json (dash.html's one-off
// "Send" flow) or a content/schedule.json entry (the Hub's schedule/post-due.mjs flow, used by "Schedule as
// Reel"). Both are checked so a video posted either way shows as posted here, not as still needing a click.
function schedResult(story){const es=(S.schedule||[]).filter(x=>x.item&&x.item.startsWith('story:'+story.name+':')).sort((a,b)=>String(b.posted_at||b.at||'').localeCompare(String(a.posted_at||a.at||'')));return es[0]||null}
// Facebook and YouTube both schedule natively (Graph API scheduled_publish_time; YouTube publishAt) --
// uploaded/sent right away but held back by the platform itself. Instagram has no scheduling API at all;
// "scheduled" for it means queued in our own content/schedule.json, published by post-due.mjs/the GHA cron
// when the time comes (so it only works if that keeps running -- see the schedule UI's own note).
function platState(story,pl){
 if(pl==='youtube'){if(!story.youtube||!story.youtube.url)return'none';if(story.youtube.publishAt&&new Date(story.youtube.publishAt)>new Date())return'scheduled';return'posted'}
 const m=story.meta&&story.meta[pl]; if(m){if(m.skipped)return'none';if(m.queued)return'scheduled';if(m.state==='schedule')return'scheduled';return'posted'}
 const e=schedResult(story); if(!e)return'none';
 if(e.result&&e.result[pl])return'posted';
 if(e.status==='blocked')return'blocked';
 if(e.status==='failed')return'failed';
 if(e.status==='queued'&&(e.platforms||[]).includes(pl))return'scheduled';
 return'none'}
function platWhen(story,pl){if(pl==='youtube')return story.youtube&&story.youtube.publishAt;const m=story.meta&&story.meta[pl];if(m)return m.queued||m.at;const e=schedResult(story);return e&&e.at}
function platError(story){const e=schedResult(story);return e&&(e.status==='failed'||e.status==='blocked')?e.error:null}
let SCHED={};
function toggleSched(key){SCHED[key]=!SCHED[key];render()}
function platBtn(story,pl,label){const key=story.name+':'+pl,st=platState(story,pl),busy=PUBBUSY[key];
 if(st==='posted')return platChip('posted');
 if(st==='scheduled'||st==='queued')return platChip(st,platWhen(story,pl));
 if(SCHED[key]){const did='dt_'+key.replace(/[^a-z0-9]/gi,'_');return `<span class="row" style="gap:4px;align-items:center"><input type="datetime-local" id="${did}" style="width:168px;padding:5px;font-size:12px"><button class="s" style="padding:5px 8px;font-size:11px" title="Fill in the next good slot from the posting-time plan" onclick="suggestTime('${story.name}','${pl}')">Suggest</button><button class="p" style="padding:5px 9px" onclick="doSchedule('${story.name}','${pl}')">Set</button><button class="s" style="padding:5px 8px" onclick="toggleSched('${key}')">✕</button></span>`}
 const err=(st==='failed'||st==='blocked')?platError(story):null;
 return (st==='failed'||st==='blocked'?platChip(st)+' ':'')+`<button class="s" ${busy?'disabled':''} onclick="${pl==='youtube'?'pubYT':'pubSocial'}('${story.name}'${pl==='youtube'?'':`,'${pl}'`})">${busy?'<span class="spin"></span>posting…':st==='failed'?'Retry now':st==='blocked'?'Retry':label}</button> <button class="s" ${busy?'disabled':''} style="padding:5px 8px" title="Schedule for later instead" onclick="toggleSched('${key}')">⏱</button>`+(err?`<div class="mut" style="width:100%;font-size:11px;margin-top:2px" title="${esc(err)}">${esc(err.slice(0,70))}${err.length>70?'…':''}</div>`:'')}
function doSchedule(name,pl){const did='dt_'+(name+':'+pl).replace(/[^a-z0-9]/gi,'_'),v=document.getElementById(did)?.value;if(!v)return toast('Pick a date and time first','bad');const iso=new Date(v).toISOString();if(pl==='youtube')pubYT(name,iso);else pubSocial(name,pl,iso)}
function storyDone(s){return platState(s,'facebook')==='posted'&&(s.format!=='short'||platState(s,'instagram')==='posted')&&platState(s,'youtube')==='posted'}
function itemPostedState(i){const e=(S.schedule||[]).filter(x=>x.item===i.id).sort((a,b)=>String(b.posted_at||b.at||'').localeCompare(String(a.posted_at||a.at||'')))[0];if(e&&e.status==='posted')return'posted';if(e&&e.status==='failed')return'failed';return i.state}
// group every item and every story under the topic it belongs to (fuzzy title match, same rule as topicEventFor)
// so one topic shows its carousel, short and long together instead of three unrelated rows.
function outputGroups(){const g=new Map();const get=k=>{if(!g.has(k))g.set(k,{title:k,items:[],stories:[]});return g.get(k)};
 for(const i of S.items||[])get(topicKeyFor(i.hook||i.topic||i.id)).items.push(i);
 for(const s of S.stories||[])if(s.packaged)get(topicKeyFor(s.title||s.name)).stories.push(s);
 return [...g.values()]}
function topicKeyFor(title){if(!title)return title;const t=(S.topics||[]).find(x=>x.title&&(x.title===title||title.includes(x.title)||x.title.includes(title)));return t?t.title:title}
function groupDone(g){return g.items.every(i=>itemPostedState(i)==='posted')&&g.stories.every(storyDone)}
function groupRow(g){const ev=topicEventFor(g.title),done=groupDone(g);
 const storyLines=g.stories.map(s=>`<div class="row" style="margin-top:4px;align-items:center"><span class="mut" style="min-width:52px">${s.format==='long'?'Long':'Short'}</span><span class="mut" style="font-size:11px">FB</span>${platBtn(s,'facebook','Post')}${s.format==='short'?`<span class="mut" style="font-size:11px">IG</span>${platBtn(s,'instagram','Post')}`:''}<span class="mut" style="font-size:11px">YT</span>${platBtn(s,'youtube','Upload')}</div>`).join('');
 const itemLines=g.items.map(i=>{const st=itemPostedState(i);return `<div class="row" style="margin-top:4px"><span class="mut" style="min-width:52px">${i.format==='carousel'?'Carousel':'Text'}</span>${st==='posted'?platChip('posted'):st==='failed'?platChip('failed')+` <button class="s" onclick="openIn('${i.id}')">Fix &amp; retry</button>`:`<button class="s" onclick="openIn('${i.id}')">${st==='approved'?'Open to post':'Open ('+esc(st)+')'}</button>`}</div>`}).join('');
 return `<div class="card"${done?' style="opacity:.6"':''}><div class="row"><b>${esc(g.title)}</b>${done?platChip('posted'):''}${ev?`<span class="mut">${esc(ev.name+' → '+ev.publishBy)}</span>`:''}</div>${storyLines}${itemLines}</div>`}
// a flat, reverse-chronological log of individual publish events (one row per story/item x platform) --
// "what exactly published earlier", separate from the topic-grouped view above it which answers "is this
// topic fully out yet". Reads whichever of the two places a post's result can live (see schedResult's note)
// and links out using the real permalink when we have one (meta.mjs now fetches it right after publishing).
function publishLog(){const rows=[],seen=new Set();const add=(key,row)=>{if(seen.has(key)||!row.at)return;seen.add(key);rows.push(row)};
 const PL={facebook:'Facebook',instagram:'Instagram',youtube:'YouTube'};
 for(const s of S.stories||[]){
  if(s.youtube&&s.youtube.url&&!(s.youtube.publishAt&&new Date(s.youtube.publishAt)>new Date()))add(s.name+':youtube',{at:s.youtube.uploaded,title:s.title,platform:'YouTube',url:s.youtube.url});
  const e=schedResult(s);if(e&&e.result)for(const pl of['facebook','instagram'])if(e.result[pl])add(s.name+':'+pl,{at:e.posted_at,title:s.title,platform:PL[pl],url:e.result[pl].permalink_url||null});
  const m=s.meta||{};for(const pl of['facebook','instagram']){const r=m[pl];if(r&&!r.skipped&&!r.queued)add(s.name+':'+pl,{at:m.when,title:s.title,platform:PL[pl],url:r.permalink_url||null})}
 }
 for(const i of S.items||[]){const e=(S.schedule||[]).filter(x=>x.item===i.id&&x.status==='posted').sort((a,b)=>String(b.posted_at||'').localeCompare(String(a.posted_at||'')))[0];if(e&&e.result)for(const pl of Object.keys(e.result))add(i.id+':'+pl,{at:e.posted_at,title:i.hook||i.id,platform:PL[pl]||pl,url:(e.result[pl]&&e.result[pl].permalink_url)||null})}
 return rows.sort((a,b)=>String(b.at||'').localeCompare(String(a.at||'')))}
function vPublishLog(){const rows=publishLog().slice(0,25);if(!rows.length)return '';return `<div class="card"><h2>Recently published</h2><table><tr><th>When</th><th>What</th><th>Where</th></tr>${rows.map(r=>`<tr><td class="mut">${esc(fmtDate(r.at))}</td><td>${esc(r.title)}</td><td>${r.url?`<a href="${esc(r.url)}" target="_blank" style="color:var(--gold)">${esc(r.platform)} ↗</a>`:esc(r.platform)}</td></tr>`).join('')}</table></div>`}
function vPublish(){
 if(!S)return '<div class="card">Loading…</div>';
 const groups=outputGroups().sort((a,b)=>{const da=groupDone(a),db=groupDone(b);if(da!==db)return da?1:-1;const ea=topicEventFor(a.title),eb=topicEventFor(b.title);if(ea&&eb)return ea.publishBy<eb.publishBy?-1:1;if(ea)return -1;if(eb)return 1;return 0});
 const waiting=groups.filter(g=>!groupDone(g)),done=groups.filter(groupDone);
 return `<div class="card"><h2>Library</h2><div class="mut">Everything you have made, one topic per row with everything it has (carousel, short, long) and where each has or has not gone out. Soonest festival deadline first. Each platform is its own button, its own call, its own status.</div></div>
 ${waiting.map(groupRow).join('')||'<div class="card mut">Nothing waiting: make something on Create, or check Carousel → Video.</div>'}
 ${vPublishLog()}
 ${done.length?`<div class="card"><h2>Fully published (${done.length})</h2><div class="mut">Out on every platform it needs. <button class="s" onclick="go('system')" style="margin-left:6px">Clean up local data (Storage, in System)</button></div></div>${done.map(groupRow).join('')}`:''}`}
async function pubSocial(name,pl,at){const key=name+':'+pl;if(PUBBUSY[key])return;PUBBUSY[key]=true;SCHED[key]=false;render();

  if(dry.note&&/already posted/.test(dry.note))toast(dry.note,'ok');

 }catch(e){toast(pl+' failed: '+e.message,'bad')}

async function pubYT(name,publishAt){const key=name+':youtube';if(PUBBUSY[key])return;PUBBUSY[key]=true;SCHED[key]=false;render();
 try{let dry;try{dry=await api('/api/yt/upload',{story:name,dryRun:true})}catch(e){if(/claims warnings/.test(e.message)){if(!confirm(e.message+'\n\nContinue anyway?')){PUBBUSY[key]=false;render();return}dry=await api('/api/yt/upload',{story:name,dryRun:true,ackClaims:true})}else throw e}
  if(dry.already){toast('Already on YouTube: '+dry.result.url,'ok')}

 PUBBUSY[key]=false;S=await api('/api/hub/state').catch(()=>S);render()}

te.json</code> (domain) and the contact email.</li><li>Google Search Console: add the subdomain, submit <code>/sitemap.xml</code> and <code>/news-sitemap.xml</code>; Publisher Center for Google News once there are real posts.</li></ol><div class="mut">Google decides News inclusion; evergreen mythology is a weaker fit than timely pieces (festivals, tithis, anniversaries), so use the timely hook field.</div></div>`}

// ---------- SYSTEM ----------
let GHA=null;
function vSystem(){const sc=`<div class="card"><h2>System check</h2><div class="row"><button class="p" onclick="runSysCheck()">Run all checks</button><span class="mut">tools, GitHub, tokens, Meta quota, models, site build, tests, schedule</span></div><div id="syscheck"></div></div>`;return sc+vSystem0()+vStorage()}
function vSystem0(){if(!GHA){api('/api/hub/gha').then(x=>{GHA=x;render()});}const c=S.comfy;return `<div class="card"><h2>Flux (ComfyUI)</h2><div class="row"><span class="chip ${c.alive?'ok':'warn'}">${c.alive?'running':'stopped'}</span><span class="mut">It starts when you generate images and stops by itself after ${c.idle_stop_minutes} idle minutes; it refuses to start during a video render (shared 24 GB RAM). The first start after a reboot can take 10-20 minutes.</span></div><div class="row" style="margin-top:8px"><button class="s" onclick="comfyAct('start')">Start now</button><button class="s" onclick="comfyAct('stop')">Stop now (frees about 8 GB)</button></div></div>
 <div class="card"><h2>Recent jobs</h2>${S.jobs.map(j=>`<div>${stChip(j.status==='running'?'scripted':j.status==='done'?'ready':'failed')} <b>${esc(j.name)}</b><pre>${esc((j.log||[]).slice(-5).join('\n'))}</pre></div>`).join('')||'<span class="mut">none</span>'}</div>
 <div class="card"><h2>GitHub Actions (recent)</h2>${GHA?(GHA.runs.map(r=>`<div><span class="chip ${r.conclusion==='success'?'ok':r.status==='in_progress'?'warn':'bad'}">${r.conclusion||r.status}</span> ${esc(r.workflowName)} <span class="mut">${esc(r.headBranch)} · ${esc(r.createdAt)}</span> <a style="color:var(--gold)" href="${r.url}" target="_blank">open</a></div>`).join('')||esc(GHA.error||'none')):'loading…'}<div class="mut" style="margin-top:6px">Scheduled workflows run only from <code>main</code>. Until then use a branch named <code>e2e/…</code> to test.</div></div>`}
async function comfyAct(a){try{const r=await api('/api/hub/comfy',{action:a});if(r.job){JOB=r.job;alert('Starting; this can take a while. Watch Recent jobs.')}load()}catch(e){alert(e.message)}}

// ---------------- Week (7 days): topics per day, shorts or long, with the script/visuals answers saved on each card ----------------
let WK={start:null,data:null,ed:null,busy:false,poll:null,pp:null,prog:null,msg:'',edit:false};
const WDAY=d=>new Date(d+'T00:00:00Z').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const HM=iso=>iso?new Date(iso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'';
const DT=iso=>new Date(iso).toLocaleString('en-GB',{timeZone:'Asia/Kolkata',weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const MIN=sec=>sec>=3600?Math.floor(sec/3600)+' h '+Math.round(sec%3600/60)+' min':sec>=90?Math.round(sec/60)+' min':sec+' s';
async function wkLoad(start){if(WK.busy){WK.pending=start||WK.start||null;return}WK.busy=true;try{WK.data=await api('/api/hub/week'+(start||WK.start?'?start='+(start||WK.start):''));WK.start=WK.data.start}catch(e){WK.msg=e.message}WK.busy=false;if(WK.pending!==undefined){const p=WK.pending;WK.pending=undefined;return wkLoad(p)}wkPoll();if(TAB==='week')render()}
function wkGo(s){WK.start=s;WK.data=null;wkLoad(s);render()}
function wkPoll(){clearInterval(WK.poll);const b=WK.data&&WK.data.days.some(d=>d.cards.some(c=>c.stages.video.state==='building'));if(b)WK.poll=setInterval(()=>{if(TAB!=='week'){clearInterval(WK.poll);return}wkLoad()},8000)}
// a chip is a FACT read from the real files (hover for why); a hand mark is drawn dashed with a hand so it can never pass for a real result
function wkChip(label,s){const ok=s.state==='done'||s.done,hand=s.hand;let cls='',mark='○ ';if(hand){cls='gold';mark='✋ '}else if(s.cls){cls=s.cls;mark=s.mark||''}else if(ok){cls='ok';mark='✓ '}else if(s.have){cls='gold';mark='✎ '}
 return '<span class="chip '+cls+'" style="'+(hand?'border-style:dashed;':'')+'" title="'+esc(s.why||'')+'">'+mark+label+'</span>'}
function wkPubChip(p){if(p.done)return wkChip('Published',{done:true,why:p.why});if(p.problem)return wkChip('Problem',{cls:'bad',mark:'✗ ',why:p.why});if(p.scheduled)return wkChip('Scheduled',{cls:'gold',mark:'⏰ ',why:p.why});if(p.partial)return wkChip('Part-published',{cls:'warn',mark:'… ',why:p.why});return wkChip('Published',{why:p.why})}
function wkCardHtml(c){const s=c.stages,vs=s.video.state,pp=s.published.platforms,pl=Object.entries(pp).filter(([,v])=>v).map(([k,v])=>({yt:'YouTube',fb:'Facebook',ig:'Instagram'}[k])+': '+v.s+(v.at?' '+DT(v.at):'')).join(' · ');
 return '<div class="card" style="margin:6px 0;padding:8px;border-left:3px solid '+(c.format==='long'?'var(--gold,#e0b050)':'var(--ok,#4fa36b)')+'"><div class="row" style="gap:6px"><span class="chip '+(c.format==='long'?'gold':'ok')+'">'+(c.format==='long'?'Long':'Short')+'</span><span class="mut">'+esc(c.time||'')+'</span><span class="grow"></span><button class="s" style="padding:2px 8px" onclick="wkOpen(\''+c.id+'\')">Open</button></div>'
 +'<div style="margin:6px 0;font-weight:600;cursor:pointer" onclick="wkOpen(\''+c.id+'\')">'+esc(c.title||'(no title)')+'</div>'+(c.why?'<div class="mut" style="font-size:11px;line-height:1.35;margin:-2px 0 6px" title="'+esc(c.why+(c.source?' | Source: '+c.source:''))+'">'+(c.culture&&c.culture!=='indian'?'🌍 '+esc(c.culture)+' · ':'')+(c.belief?'⚠ belief · ':'')+(c.regional?'regional · ':'')+esc((c.theme||'').replace(/_/g,' '))+' · '+esc(String(c.why).split(' | ')[0].slice(0,64))+'</div>':'')+'<div class="row" style="gap:4px;flex-wrap:wrap">'
 +wkChip('Topic',s.topic)+wkChip('Script',s.script)+wkChip('Visuals',s.visuals)
 +wkChip('Video',vs==='building'?{cls:'warn',mark:'⏳ ',why:s.video.why}:vs==='failed'?{cls:'bad',mark:'✗ ',why:s.video.why}:vs==='partial'?{have:true,why:s.video.why}:s.video)
 +wkPubChip(s.published)+'</div>'+(pl?'<div class="mut" style="margin-top:4px;font-size:11px">'+esc(pl)+'</div>':'')+'</div>'}
function vWeek(){if(!WK.data){wkLoad();return '<div class="card">Loading the week…'+(WK.msg?' <span class="bad">'+esc(WK.msg)+'</span>':'')+'</div>'}
 const d=WK.data,c=d.counts;
 let h='<div class="card"><h2>Next 7 days: topics, scripts, visuals, videos</h2><div class="mut">One card per video, a short or a long. Every tick is read from real files (hover a chip to see why); a dashed ✋ chip was marked by hand. Open a card to get the script and visuals prompts, save your pasted answers, build, and watch each phase.</div>'
 +'<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><button class="s" onclick="wkGo(\''+d.prev+'\')">◀ Previous 7 days</button><button class="s" onclick="wkGo(\''+d.today+'\')">Today</button><button class="s" onclick="wkGo(\''+d.next+'\')">Next 7 days ▶</button><input type="date" value="'+d.start+'" onchange="wkGo(this.value)" title="start the 7 days on this date"><span class="grow"></span><button class="p" onclick="wkSuggest()">Fill empty days from my topic bank</button></div>'
 +'<div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap"><span class="chip">'+c.cards+' topics</span><span class="chip ok">'+c.shorts+' shorts</span><span class="chip gold">'+c.longs+' long</span><span class="chip">'+c.script+' scripts</span><span class="chip">'+c.visuals+' visuals</span><span class="chip">'+c.video+' videos made</span><span class="chip gold">⏰ '+(c.scheduled||0)+' scheduled</span><span class="chip ok">'+c.published+' published</span></div>'+(WK.msg?'<div class="mut" style="margin-top:6px">'+esc(WK.msg)+'</div>':'')+'</div>';
 h+='<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px">'+d.days.map(day=>'<div><div class="card" style="padding:8px;'+(day.date===d.today?'border-color:var(--gold,#e0b050)':'')+'"><div class="row"><b>'+WDAY(day.date)+'</b>'+(day.date===d.today?' <span class="chip gold">today</span>':'')+'<span class="grow"></span><button class="s" style="padding:2px 8px" onclick="wkAdd(\''+day.date+'\')">+ Add topic</button></div>'+(day.cards.length?day.cards.map(wkCardHtml).join(''):'<div class="mut" style="margin-top:8px">No topic yet</div>')+'</div></div>').join('')+'</div>';
 return h+wkEditor()}
function wkAdd(date){const t=prompt('Topic for '+WDAY(date)+' (Hindi question or promise):');if(!t||!t.trim())return;const long=confirm('Make it a LONG video?\nOK = long (16:9 film)   Cancel = short (vertical)');api('/api/hub/week/card',{date,title:t.trim(),format:long?'long':'short'}).then(r=>{WK.msg='';wkLoad().then(()=>wkOpen(r.id))}).catch(e=>alert(e.message))}
async function wkSuggest(){if(!S||!S.topics){alert('The topic bank is still loading');return}
 const ranked=topicRank(),used=new Set((WK.data.days.flatMap(d=>d.cards)).map(c=>c.title)),slots={};PLAN.filter(x=>['reel','yt_long','fb_long'].includes(x.kind)).forEach(x=>(slots[x.date]=slots[x.date]||[]).push(x));
 let made=0;for(const day of WK.data.days){if(day.cards.length)continue;const sl=slots[day.date]&&slots[day.date].length?slots[day.date]:[{kind:'reel',time:'19:00'}];for(const x of sl){const t=ranked.find(t=>!used.has(t.title));if(!t)break;used.add(t.title);await api('/api/hub/week/card',{date:day.date,time:x.time,title:t.title,format:x.kind==='reel'?'short':'long',source:t.query?'English search words: '+t.query:''});made++}}
 WK.msg=made?'Added '+made+' topic(s) from your topic bank. Edit or replace any of them.':'Every day already has a topic (or the topic bank has nothing left to suggest).';wkLoad()}
const wkTopicKey=e=>[e.title,e.date,e.format,e.source,e.series].join('\u0001');
async function wkOpen(id){try{const c=await api('/api/hub/week/card?id='+id);clearInterval(WK.pp);WK.edit=false;WK.prog=null;WK.ed={id,date:c.date,time:c.time||'',format:c.format,title:c.title||'',culture:c.culture||'',angle:c.angle||'',untold:!!c.untold,why:c.why||'',belief:!!c.belief,regional:!!c.regional,source:c.source||'',series:c.series||'',script:c.script||'',visuals:c.visuals||'',scriptSaved:c.scriptSaved??c.script??'',visualsSaved:c.visualsSaved??c.visuals??'',scriptAt:c.scriptSavedAt||null,visualsAt:c.visualsSavedAt||null,flags:c.flags||{},prompt:'',vprompt:'',check:c.check||null,slug:c.slug||null,note:''};WK.ed.topicSaved=wkTopicKey(WK.ed);render();wkProg(true);setTimeout(()=>{const e=$('#wked');if(e)e.scrollIntoView({behavior:'smooth'})},50)}catch(e){alert(e.message)}}
// save state, always visible and live while typing (updates the three status lines without re-rendering, so the cursor stays put)
function wkSt(kind){const e=WK.ed;if(!e)return '';const sz=t=>t.length.toLocaleString('en-IN')+' characters';
 if(kind==='topic'){return wkTopicKey(e)===e.topicSaved?'<span class="chip ok">✓ Topic saved</span>':'<span class="chip warn">● Unsaved topic changes</span>'}
 const text=e[kind],saved=e[kind+'Saved'],at=e[kind+'At'];if(!text.trim()){const cd=WK.data&&WK.data.days.flatMap(d=>d.cards).find(c=>c.id===e.id),sg=cd&&cd.stages[kind];return '<span class="chip">○ Nothing pasted into this card</span>'+(sg&&sg.done?' <span class="mut">· but: '+esc(sg.why)+'</span>':'')}
 if(text!==saved)return '<span class="chip warn">● Not saved: you have changed this since the last save (click Save '+kind+')</span> <span class="mut">'+sz(text)+'</span>';
 const k=e.check;return '<span class="chip ok">✓ Saved'+(at?' at '+HM(at):'')+'</span> <span class="mut">'+sz(text)+(k?(k.ok?' · accepted by the checker':' · the checker found problems (below)'):'')+'</span>'}
function wkStatus(){for(const k of ['topic','script','visuals']){const el=$('#wkst_'+k);if(el)el.innerHTML=wkSt(k)}}
function wkEditor(){const e=WK.ed;if(!e)return '';const k=e.check;
 return '<div class="card" id="wked" style="margin-top:12px;border-color:var(--gold,#e0b050)"><div class="row"><h2 style="margin:0">'+esc(e.title||'Topic')+'</h2><span class="grow"></span><button class="s" onclick="clearInterval(WK.pp);WK.ed=null;render()">Close</button> <button class="s" onclick="wkDelete()">Delete card</button></div>'
 +(e.why?'<div class="mut" style="margin-top:8px;font-size:12px;line-height:1.5">'+(e.angle?'<b>Angle:</b> '+esc(e.angle)+'<br>':'')+(e.culture&&e.culture!=='indian'?'<b>Culture:</b> '+esc(e.culture)+' (pictures follow it: no Indian look)<br>':'')+'<b>Why this topic:</b> '+esc(e.why)+(e.source?'<br><b>Verify in:</b> '+esc(e.source):'')+(e.belief?'<br>⚠ A belief: write it as मान्यता, not fact.':'')+(e.regional?'<br>Regional retelling: label it as one.':'')+'</div>':'')
 +'<div class="row" style="margin-top:8px;gap:8px;flex-wrap:wrap"><input style="min-width:320px;flex:1" value="'+esc(e.title)+'" placeholder="Topic (Hindi question or promise)" oninput="WK.ed.title=this.value;wkStatus()"><input type="date" value="'+e.date+'" onchange="WK.ed.date=this.value;wkStatus()"><select onchange="WK.ed.format=this.value;WK.ed.prompt=\'\';wkStatus()"><option value="short" '+(e.format==='short'?'selected':'')+'>Short (vertical)</option><option value="long" '+(e.format==='long'?'selected':'')+'>Long (16:9, chapters)</option></select><button class="s" onclick="wkSaveTopic()">Save topic</button> <span id="wkst_topic">'+wkSt('topic')+'</span></div>'
 +'<textarea rows="3" style="margin-top:6px;width:100%" placeholder="Source passages the writer must stay inside (verse + translation, section numbers)" oninput="WK.ed.source=this.value;wkStatus()">'+esc(e.source)+'</textarea><input style="margin-top:6px;width:100%" placeholder="Series context: previous episode / what the next one is" value="'+esc(e.series)+'" oninput="WK.ed.series=this.value;wkStatus()">'
 +'<h3 style="margin-top:14px">1. Script</h3><div class="row"><button class="p" onclick="wkPrompt()">Get the script prompt</button><span class="mut">copy it into your model; paste its answer below</span></div>'
 +(e.prompt?'<textarea id="wkprompt" rows="8" readonly style="width:100%;margin-top:6px">'+esc(e.prompt)+'</textarea><div style="margin-top:4px"><button class="s" onclick="cp(\'wkprompt\')">Copy script prompt</button></div>':'')
 +'<textarea rows="10" style="width:100%;margin-top:6px" placeholder="Paste the script answer (FORMAT / SLUG / TITLE / THUMB / NARRATION …)" oninput="WK.ed.script=this.value;wkStatus()">'+esc(e.script)+'</textarea><div class="row" style="margin-top:4px"><button class="p" onclick="wkSave(\'script\')">Save script</button><span id="wkst_script">'+wkSt('script')+'</span></div>'
 +'<h3 style="margin-top:14px">2. Visuals</h3><div class="row"><button class="p" '+(e.script.trim()?'':'disabled')+' onclick="wkVPrompt()">Get the visuals prompt</button><span class="mut">it carries your saved script</span></div>'
 +(e.vprompt?'<textarea id="wkvprompt" rows="8" readonly style="width:100%;margin-top:6px">'+esc(e.vprompt)+'</textarea><div style="margin-top:4px"><button class="s" onclick="cp(\'wkvprompt\')">Copy visuals prompt</button></div>':'')
 +'<textarea rows="10" style="width:100%;margin-top:6px" placeholder="Paste the visuals answer (CAST / THUMB_SCENE / LOOK / SCENES / VISUALS)" oninput="WK.ed.visuals=this.value;wkStatus()">'+esc(e.visuals)+'</textarea><div class="row" style="margin-top:4px"><button class="p" onclick="wkSave(\'visuals\')">Save visuals</button><span id="wkst_visuals">'+wkSt('visuals')+'</span></div>'
 +(k?'<div style="margin-top:10px"><span class="chip '+(k.ok?'ok':'bad')+'">'+(k.ok?'checker: accepted':'checker: needs fixing')+'</span> <b>'+k.stats.beats+'</b> beats, <b>'+k.stats.words+'</b> words (about '+Math.floor(k.stats.est_seconds/60)+' min '+(k.stats.est_seconds%60)+' s), '+k.stats.scenes+' picture prompts, '+k.stats.visuals+' visual directions'+(k.errors.length?'<div style="margin-top:6px;color:var(--bad,#d9573f)">'+k.errors.map(x=>'✗ '+esc(x)).join('<br>')+'</div>':'')+(k.warnings.length?'<div style="margin-top:6px;color:var(--warn,#e0a040)">'+k.warnings.slice(0,8).map(x=>'! '+esc(x)).join('<br>')+'</div>':'')+'</div>':'')
 +'<h3 style="margin-top:14px">3. Build the video</h3><div class="row"><button class="p" '+(k&&k.ok&&!wkBuilding()?'':'disabled')+' onclick="wkBuild()">Build the video now</button><span class="mut">'+(k&&k.ok?(e.visuals.trim()?'script and visuals are saved and accepted':'no visuals pasted: the local director will plan the pictures'):'save the script first (and fix the red items)')+'</span></div>'+(e.note?'<div class="mut" style="margin-top:6px">'+esc(e.note)+'</div>':'')
 +'<div id="wkprog" style="margin-top:10px">'+wkProgHtml()+'</div>'
 +'<details style="margin-top:12px"><summary class="mut">Already have this part? Mark it by hand (shown as a dashed ✋ chip)</summary><div class="row" style="margin-top:6px;gap:14px">'+['script','visuals','video','published'].map(k=>'<label><input type="checkbox" '+(e.flags[k]?'checked':'')+' onchange="wkFlag(\''+k+'\',this.checked)"> '+k+'</label>').join('')+'</div></details></div>'}
const wkBuilding=()=>WK.prog&&WK.prog.state==='building';
async function wkFlag(k,v){const e=WK.ed;try{await api('/api/hub/week/draft',{id:e.id,flags:{[k]:v}});e.flags[k]=v;wkLoad()}catch(x){alert(x.message)}}
async function wkSaveTopic(){const e=WK.ed;try{await api('/api/hub/week/card',{id:e.id,date:e.date,time:e.time,format:e.format,title:e.title,source:e.source,series:e.series});e.topicSaved=wkTopicKey(e);wkStatus();wkLoad()}catch(x){alert(x.message)}}
async function wkSave(which){const e=WK.ed;try{await wkSaveTopic();const r=await api('/api/hub/week/draft',{id:e.id,[which]:e[which]});e.check=r.check;e.slug=r.slug||e.slug;e[which+'Saved']=e[which];e[which+'At']=new Date().toISOString();render();wkProg(true);wkLoad()}catch(x){alert(x.message)}}
async function wkPrompt(){const e=WK.ed;if(!e.title.trim())return alert('Write the topic first');try{const r=await api('/api/hub/pack/script-prompt?topic='+encodeURIComponent(e.title)+'&format='+e.format+'&source='+encodeURIComponent(e.source)+'&series='+encodeURIComponent(e.series)+'&culture='+encodeURIComponent(e.culture||'')+'&angle='+encodeURIComponent(e.angle||'')+'&untold='+(e.untold?1:0));e.prompt=r.prompt;render()}catch(x){alert(x.message)}}
async function wkVPrompt(){const e=WK.ed;try{const r=await api('/api/hub/pack/visuals-prompt',{script:e.script,culture:e.culture||''});e.vprompt=r.prompt;render()}catch(x){alert(x.message)}}
async function wkBuild(){const e=WK.ed;if(!confirm('Start building this video now? The Mac is busy for the whole build; you can watch every phase below.'))return;try{await wkSave('visuals');const r=await api('/api/hub/week/build',{id:e.id});e.slug=r.slug;e.note='Build started.';render();wkProg(true);wkLoad()}catch(x){alert(x.message)}}
async function wkDelete(){if(!confirm('Delete this topic card? (a built video is not touched)'))return;await api('/api/hub/week/delete',{id:WK.ed.id});clearInterval(WK.pp);WK.ed=null;wkLoad()}
// ---- live build progress for the open card: every phase with its status, time and detail, a progress bar and an ETA; refreshes every 4 s while building ----
const PH={script:'Script split','prepare':'Prepare folders',voice:'Narration voice',director:'Scene plan',coverage:'Shot cuts & colour arc',art:'Paint the pictures','layers+scene':'Depth layers & scene',camera:'Camera moves','sound':'Sound design','render+QA':'Render & quality check',thumbnail:'Thumbnail',package:'Publish kit (title, captions)'};
async function wkProg(first){const e=WK.ed;if(!e||!e.slug){WK.prog=null;const el=$('#wkprog');if(el)el.innerHTML=wkProgHtml();return}
 try{WK.prog=await api('/api/hub/week/progress?id='+e.id)}catch(x){WK.prog=null}const el=$('#wkprog');if(el)el.innerHTML=wkProgHtml();
 clearInterval(WK.pp);if(WK.prog&&WK.prog.state==='building')WK.pp=setInterval(()=>{if(!WK.ed||TAB!=='week'){clearInterval(WK.pp);return}wkProg()},4000);else if(!first)wkLoad()}
function wkProgHtml(){const p=WK.prog,e=WK.ed;if(!p||p.state==='idle')return '<div class="mut">Not built yet. Save the script (and visuals), then Build.</div>';
 const chip={done:'ok',cached:'ok',running:'warn',failed:'bad',pending:''},ic={done:'✓',cached:'✓',running:'⏳',failed:'✗',pending:'○'};
 const head={building:'<span class="chip warn">⏳ building now</span>',done:'<span class="chip ok">✓ finished</span>',failed:'<span class="chip bad">✗ stopped at '+esc(p.failedAt||'?')+'</span>',stopped:'<span class="chip warn">stopped before finishing</span>'}[p.state]||'';
 let h='<div class="row" style="gap:10px;flex-wrap:wrap">'+head+'<span class="mut">'+p.doneCount+' of '+p.total+' phases</span>'+(p.state==='building'?'<span><b>ETA about '+MIN(p.etaSeconds)+'</b> <span class="mut">(finishes around '+new Date(p.etaAt).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+')</span></span>':'')+'<span class="mut">elapsed '+MIN(p.elapsedSeconds)+'</span></div>'
 +'<div style="height:8px;background:var(--line,#2a2d35);border-radius:6px;margin:8px 0;overflow:hidden"><div style="height:100%;width:'+p.pct+'%;background:var(--ok,#4fa36b)"></div></div>'
 +'<table><tr><th></th><th>Phase</th><th>Status</th><th>Time</th><th>Detail</th></tr>'+p.stages.map(s=>'<tr><td>'+ic[s.status]+'</td><td>'+esc(PH[s.name]||s.name)+'</td><td><span class="chip '+(chip[s.status]||'')+'">'+esc(s.status)+'</span></td><td>'+(s.status==='running'?esc(MIN(s.elapsed||0))+' so far'+(s.eta?' · ~'+esc(MIN(s.eta))+' left':''):s.seconds!=null?esc(MIN(s.seconds)):s.eta?'~'+esc(MIN(s.eta)):'')+'</td><td class="mut">'+esc(s.name==='art'&&s.status==='running'&&p.art?'picture '+p.art.done+' of '+p.art.total:s.detail)+'</td></tr>').join('')+'</table>';
 if(p.state==='building'&&p.log&&p.log.length)h+='<pre style="max-height:120px;overflow:auto;margin-top:6px">'+esc(p.log.slice(-6).join('\n'))+'</pre>';
 if(p.state==='failed'||p.state==='stopped')h+='<div class="row" style="margin-top:8px"><button class="p" onclick="wkResume()">Resume from where it stopped</button><span class="mut">finished phases are kept, only the rest runs again</span></div>';
 if(p.mp4&&p.state!=='building'){h+='<h3 style="margin-top:14px">Your video</h3><div class="row" style="align-items:flex-start;gap:14px"><video src="'+p.mp4+'?'+Date.now()+'" controls style="'+(e.format==='long'?'width:520px':'width:250px')+';border-radius:10px;border:1px solid var(--line)"></video>'+(p.cover?'<div><div class="mut">Thumbnail</div><img src="'+p.cover+'?'+Date.now()+'" style="width:150px;border-radius:8px"></div>':'')
  +'<div><div class="mut" style="margin-bottom:6px">Change anything, then rebuild only what changed:</div><div class="row" style="gap:6px;flex-wrap:wrap"><button class="p" onclick="WK.edit=!WK.edit;render()">'+(WK.edit?'Hide':'Edit scenes & pictures')+'</button><a class="s" style="display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px" target="_blank" href="/scenes?story=video-'+esc(p.slug)+'">Open the editor in a new tab</a><button class="s" onclick="wkResume()">Rebuild with the latest edits</button><button class="s" onclick="go(\'publish\')">Go to Library to publish</button></div><div class="mut" style="margin-top:6px">To change the words: edit the script above, save, and Build again (the voice is redone).</div></div></div>'
  +(WK.edit?'<iframe src="/scenes?story=video-'+esc(p.slug)+'&embed=1" style="width:100%;height:720px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#0e0f12"></iframe>':'')}
 return h}
async function wkResume(){const e=WK.ed;if(!e||!e.slug)return;try{await api('/api/hub/video/resume',{id:e.slug+'.video'});e.note='Resumed.';wkProg(true);wkLoad()}catch(x){alert(x.message)}}
load();setInterval(()=>{if(TAB==='system'&&!$('#modal').innerHTML)load()},20000);

// ---------- CAROUSEL -> VIDEO + AUTOPILOT ----------
let RL=null,SC=null;
function vReels(){if(!RL)api('/api/hub/reels').then(x=>{RL=x;render()});const r=RL;
 const step=(ok,l)=>`<span class="chip ${ok?'ok':''}">${ok?'✓ ':''}${l}</span>`;
 return `<div class="card"><h2>Autopilot: one click, the studio does the rest</h2><div class="mut">Writer model (${'local Ollama, or Anthropic if a key is set'}) drafts a sourced carousel and the reel narration, QA-checks and repairs it; then Flux makes the pictures, and the studio renders the carousel and the stippled reel. Nothing is typed by hand. Posting still waits for your approval.</div>
 <div class="row" style="margin-top:8px"><input id="apslug" class="grow" placeholder="Topic (leave empty = next topic from the bank${r&&r.next_topic?': '+esc(r.next_topic):''})"><input id="apnote" class="grow" placeholder="Optional guidance, e.g. keep it under the Navratri frame"><button class="p" onclick="autopilot()">Run Autopilot</button></div>
 <div class="mut" style="margin-top:6px">Takes about 1 to 1.5 hours of Mac time (drafting, 10 pictures, voice, render). One job at a time; Flux starts and stops by itself.</div></div><div id="jobbox"></div>
 <div class="card"><h2>How a video is made: what you give, what the studio decides</h2>
 <div class="mut"><b>You give 1 thing (2 optional):</b>
 <ol style="margin:6px 0 6px 18px;padding:0">
 <li><b>The narration script (required).</b> One spoken line per row, Devanagari Hindi, about 30 to 40 lines (380 to 480 words = 3 minutes). Line 1 is the hook question, the last lines are your close. Use only facts from your source. Mark one punch word per line with <code>*stars*</code> if you want to choose it yourself; otherwise the studio picks.</li>
 <li><i>Optional:</i> a carousel for the same story. Its paintings are reused and its source line and claims travel with the video. Without it the studio paints its own scenes from your script.</li>
 <li><i>Optional:</i> your own picture for a scene (drop it in the story's assets); otherwise it is generated.</li></ol>
 <b>You never give:</b> image prompts, effects, camera moves, music, colours, captions.<br>
 <b>How the visuals are decided (automatic, different for every video):</b>
 <ul style="margin:6px 0 6px 18px;padding:0">
 <li><b>Look:</b> palette, caption style (pop / box / karaoke), Instagram grade (film / teal / dream / light-leak) and transition are picked from the story and mood, and never repeat the last films.</li>
 <li><b>Director:</b> reads each line, decides what it is (hook, shock, fact, list, number, quote, turn) and picks one of the picture-with-camera, kinetic type, number, bars, timeline, icon list or dot-word scenes, plus one of the 30 strict effects. Rules: no effect three times in a row, at least 5 scene types a minute, text scenes hide the subtitle.</li>
 <li><b>Pictures:</b> the writer model turns each line into a scene description, Draw Things paints it (about 40 s each), an OCR guard redoes any picture with lettering, depth and cut-out layers keep faces and hands rigid.</li>
 <li><b>Life:</b> embers, leaves, petals, mist, water and rays come from the words in the line; Lottie stickers, hand-drawn marks (rough.js), GSAP easing and a unique Ken Burns per scene are added automatically.</li></ul>
 <b>Time for one 3-minute video:</b> about 35 to 45 minutes on this Mac (voice about 14 min, paintings about 13 min if all new, depth layers and camera about 7 min, render about 2 min, checks 1 min). The table below shows the real time of each step after every run.<br>
 <b>Steps:</b> 1 pick the carousel, 2 get the prompt, 3 paste it into your frontier model, 4 paste its script below, 5 Check, 6 Make the video, 7 watch the progress, 8 approve and publish from the Publish tab.</div></div>
 <div class="card"><h2>3-minute video: paste the script, the studio makes everything else</h2><div class="mut">1. Pick a carousel. 2. <b>Get the prompt</b>, give it to your frontier model (Claude, GPT, Gemini) and paste its answer below (one spoken line per row). 3. <b>Check</b>, then <b>Make the video</b>. The studio then voices it, plans every visual, paints what the carousel does not cover, builds depth and camera moves, renders, checks and times each step. Leave the box empty and the studio writes the script itself with its local model (weaker Hindi).</div>
 <div class="row" style="margin-top:8px"><select id="vid" style="max-width:380px">${r?r.reels.map(x=>`<option value="${x.id}" ${VSEL===x.id?'selected':''}>${esc(x.id)} ${x.video&&x.video.mp4?'(video exists)':''}</option>`).join(''):''}</select><button class="s" onclick="vbrief()">Get the prompt for my frontier model</button></div>
 <div id="vbriefbox" style="display:none;margin-top:8px"><textarea id="vbriefta" rows="10" readonly></textarea><div style="margin-top:6px"><button class="p" onclick="cp('vbriefta')">Copy prompt</button></div></div>
 <textarea id="vscript" rows="9" style="margin-top:8px" placeholder="Paste the script here: one spoken thought per line, Devanagari Hindi"></textarea>
 <div class="row" style="margin-top:6px"><button class="s" onclick="vcheck()">Check the script</button><button class="p" onclick="vmake()">Make the video</button><span id="vresult" class="mut"></span></div></div>
 <div class="card"><h2>Languages: the studio translates the blog for the world</h2><div class="mut">Hindi is the source. The writer model translates each approved post and the site text; the site then serves it at /en/, /mr/ and so on, with hreflang and a "machine translated" label. Local models are best at English, then Spanish, Portuguese, Indonesian, Marathi; Tamil, Telugu, Bengali and Gujarati need an Anthropic key for good quality.</div><div class="row" style="margin-top:8px">${[["en","English"],["mr","मराठी"],["es","Español"],["pt","Português"],["id","Indonesia"],["bn","বাংলা"],["ta","தமிழ்"],["te","తెలుగు"],["gu","ગુજરાતી"]].map(([c,n])=>`<label class="chip"><input type="checkbox" class="lg" value="${c}" style="width:auto"> ${n}</label>`).join("")}<button class="p" onclick="translateNow()">Translate all approved posts</button></div></div>
 <div class="card"><h2>Carousels and their videos</h2>${!r?'Loading…':`<table><tr><th>Carousel</th><th>Steps</th><th>Video</th><th></th></tr>${r.reels.map(x=>`<tr><td><b>${esc(x.hook||x.slug)}</b><div class="mut">${esc(x.id)} ${stChip(x.status||'draft')}</div></td><td>${step(x.art.need===0||x.art.have>=x.art.need,'images '+x.art.have+'/'+x.art.need)}${step(x.narration,'narration')}${step(x.steps.voice,'voice')}${step(x.steps.video,'rendered')}${step(x.steps.qa,'QA')}${step(x.steps.packaged,'packaged')}${x.scheduled?'<span class="chip gold">scheduled</span>':''}</td><td>${x.mp4?`<video src="${x.mp4}" controls preload="none" poster="${x.cover||''}" style="height:230px;border-radius:8px"></video>`:'<span class="mut">no reel yet</span>'}${x.video&&x.video.mp4?`<div class="mut" style="margin-top:6px">3-min video (${x.video.duration||'?'} s)</div><video src="${x.video.mp4}" controls preload="none" poster="${x.video.cover||''}" style="height:230px;border-radius:8px"></video>`:''}${x.video&&x.video.timing?`<div class="mut" style="margin-top:6px">${timingHtml(x.video.timing)}</div>`:''}</td><td><button class="s" onclick="reelMake('${x.id}')">${x.mp4?'Rebuild reel':'Make reel (75 s)'}</button> <button class="p" onclick="videoMake('${x.id}')">${x.video&&x.video.mp4?'Rebuild 3-min video':'Make 3-min video'}</button> <button class="s" onclick="openReelItem('${x.id}')">Open</button></td></tr>`).join('')}</table>`}</div>`}
async function autopilot(){const slug=$('#apslug').value.trim(),note=$('#apnote').value.trim();if(!confirm('Start Autopilot'+(slug?' for '+slug:' for the next topic')+'? It uses the Mac for 1 to 1.5 hours.'))return;try{const r=await api('/api/hub/autopilot',{slug,note});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
async function translateNow(){const langs=[...document.querySelectorAll('.lg:checked')].map(x=>x.value);if(!langs.length)return alert('Tick at least one language');if(!confirm('Translate approved posts and the site text into '+langs.join(', ')+'? Runs on the Mac; about 5 to 20 minutes per post and language.'))return;try{let r=await api('/api/hub/translate',{langs,ui:true});JOB=r.job;pollJob();const t=setInterval(async()=>{const j=await api('/api/hub/jobs');if(!j.running){clearInterval(t);try{r=await api('/api/hub/translate',{langs});JOB=r.job;pollJob()}catch(e){alert(e.message)}}},4000)}catch(e){alert(e.message)}}
function timingHtml(t){if(!t||!t.stages)return'';const tot=t.total_seconds||0;return `<b>video build ${Math.floor(tot/60)} min ${tot%60} s${t.ended?'':' (running)'}</b><table>${t.stages.map(s=>`<tr><td>${esc(s.name)}</td><td>${stChip(s.status==='done'||s.status==='cached'?'ready':s.status==='failed'?'failed':'scripted')}</td><td>${s.seconds!=null?Math.floor(s.seconds/60)+'m '+(s.seconds%60)+'s':'…'}</td><td class="mut">${esc((s.detail||'').slice(0,70))}</td></tr>`).join('')}</table>`}
async function videoMake(id){if(!confirm('Make the 3-minute vertical video? The system writes or takes the script, voices it, plans every visual, generates missing pictures, renders and checks it. About 1.5 to 3 hours of Mac time; every stage is timed.'))return;try{const r=await api('/api/hub/video/make',{id,minutes:3});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
let VSEL=null;
async function vbrief(){VSEL=$('#vid').value;try{const r=await api('/api/hub/video/brief?id='+encodeURIComponent(VSEL));$('#vbriefta').value=r.prompt;$('#vbriefbox').style.display='block'}catch(e){alert(e.message)}}
async function vcheck(save){VSEL=$('#vid').value;const t=$('#vscript').value;try{const r=await api('/api/hub/video/script',{id:VSEL,text:t,save:!!save});$('#vresult').innerHTML=`<span class="chip ${r.ok?'ok':'bad'}">${r.beats} lines</span><span class="chip">${r.words} words</span><span class="chip">about ${Math.floor(r.seconds/60)} min ${r.seconds%60} s</span>${r.notes.map(n=>`<div class="chip ${/^QA /.test(n)?'bad':'warn'}">${esc(n)}</div>`).join('')}${r.saved?'<span class="chip ok">script saved</span>':''}`;return r}catch(e){$('#vresult').innerHTML='<span class="chip bad">'+esc(e.message)+'</span>';return null}}
async function vmake(){VSEL=$('#vid').value;const t=$('#vscript').value.trim();if(t){const r=await vcheck(true);if(!r||!r.ok){alert('Fix the script first (red notes).');return}}else if(!confirm('No script pasted: the studio will write one with its local model (weaker Hindi). Continue?'))return;if(!confirm('Make the video now? The Mac is busy for a while; every step is timed below.'))return;try{const r=await api('/api/hub/video/make',{id:VSEL,minutes:3});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
async function reelMake(id){if(!confirm('Make the video for '+id+'? Images, voice, render and QA run by themselves (30 to 60 min).'))return;try{const r=await api('/api/hub/reel/make',{id});JOB=r.job;pollJob();pollReels()}catch(e){alert(e.message)}}
function pollReels(){let k=0;const t=setInterval(async()=>{if(!(TAB==='create'&&CREATEMODE==='autopilot')){clearInterval(t);return}const j=await api('/api/hub/jobs');if(!j.running){clearInterval(t);RL=null;render();return}if(++k%3===0){try{RL=await api('/api/hub/reels');if(!document.querySelector('#jobbox pre')||true){const jb=$('#jobbox').innerHTML;render();$('#jobbox').innerHTML=jb}}catch(e){}}},5000)}
async function openReelItem(id){go('create');setTimeout(()=>{try{openItem(id)}catch{}},400)}
async function runSysCheck(){$('#syscheck').innerHTML='<div class="mut">Running 38 checks (tests, site build, tokens, GitHub). About a minute…</div>';try{SC=(await api('/api/hub/syscheck')).checks}catch(e){$('#syscheck').innerHTML='<span class="chip bad">'+esc(e.message)+'</span>';return}
 const f=SC.filter(x=>x.level==='FAIL'),w=SC.filter(x=>x.level==='WARN');$('#syscheck').innerHTML=`<div class="row"><span class="chip bad">${f.length} fail</span><span class="chip warn">${w.length} warn</span><span class="chip ok">${SC.length-f.length-w.length} ok</span></div><table>${[...f,...w,...SC.filter(x=>x.level==='OK')].map(x=>`<tr><td>${stChip(x.level==='OK'?'ready':x.level==='WARN'?'needs review':'failed')}</td><td>${esc(x.area)}</td><td>${esc(x.check)}</td><td class="mut">${esc(x.detail)}</td></tr>`).join('')}</table>`}
</script></body></html>
