<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATHAAYA Hub</title>
<style>
:root{--bg:#0f0d0b;--card:#1a1612;--line:#2f271f;--fg:#ecdfc2;--dim:#9a8a6a;--gold:#d4a94a;--red:#a53a2f;--ok:#4f9d69;--warn:#d0a23a;--bad:#c4503f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,'Segoe UI',sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;flex-wrap:wrap}
header b{color:var(--gold);letter-spacing:.14em;margin-right:8px}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:1px solid var(--line);color:var(--fg);padding:6px 11px;border-radius:7px;cursor:pointer}nav button.on{background:var(--gold);color:#1a1209;border-color:var(--gold);font-weight:700}
main{padding:16px;max-width:1280px;margin:0 auto}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}h2{margin:0 0 8px;font-size:16px;color:var(--gold)}h3{margin:12px 0 6px;font-size:14px}
.mut{color:var(--dim);font-size:12.5px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}
button.p,button.s,button.d{border:0;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600}button.p{background:var(--gold);color:#1a1209}button.s{background:#2b2218;color:var(--fg);border:1px solid var(--line)}button.d{background:var(--bad);color:#fff}button:disabled{opacity:.4;cursor:not-allowed}
textarea,input,select{background:#120f0c;color:var(--fg);border:1px solid var(--line);border-radius:7px;padding:7px;font:inherit;width:100%}textarea{font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid var(--line);margin:1px}.ok{color:var(--ok);border-color:var(--ok)}.warn{color:var(--warn);border-color:var(--warn)}.bad{color:var(--bad);border-color:var(--bad)}.gold{color:var(--gold);border-color:var(--gold)}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:600;font-size:12px}
.day{display:grid;grid-template-columns:96px 1fr;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:178px;cursor:pointer;background:#16120e}.slot:hover{border-color:var(--gold)}.slot.empty{border-style:dashed;color:var(--dim)}.slot.scheduled{border-color:#6c8fb5}.slot.posted{border-color:var(--ok)}.slot.failed{border-color:var(--bad)}
.thumbs{display:flex;gap:6px;overflow:auto;padding:4px 0}.thumbs img{height:170px;border-radius:6px;border:1px solid var(--line)}
pre{background:#120f0c;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;font-size:12px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:20}.modal>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;width:min(560px,94vw);max-height:90vh;overflow:auto}
@media(max-width:700px){.day{grid-template-columns:1fr}}
</style></head><body>
<header><b>KATHAAYA HUB</b><nav id="nav"></nav><span class="grow"></span><span id="sys" class="mut"></span></header><main id="view">Loading…</main><div id="modal"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){const r=await fetch(p,b===undefined?{}:{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)});const j=await r.json().catch(()=>({error:'bad response'}));if(!r.ok)throw new Error(j.error||r.status);return j}
const TABS=[['plan','Plan (30 days)'],['topics','Topics'],['create','Create'],['facebook','Facebook'],['instagram','Instagram'],['youtube','YouTube'],['blog','Blog'],['storage','Storage & limits'],['system','System']];
let TAB=(location.hash||'#plan').slice(1),S=null,PLAN=[],CUR=null,JOB=null,BRIEF='';
const KIND={fb_text:'FB text',carousel:'Carousel',reel:'Reel / Short',fb_long:'FB long video',yt_long:'YouTube long'};
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===TAB?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(t){TAB=t;location.hash=t;load()}
async function load(){try{[S,PLAN]=await Promise.all([api('/api/hub/state'),api('/api/hub/plan?days=30').then(x=>x.slots)])}catch(e){$('#view').innerHTML='<div class="card bad">'+esc(e.message)+'</div>';return}
 const c=S.comfy;$('#sys').innerHTML=`Flux: <span class="chip ${c.alive?'ok':c.starting?'warn':''}">${c.alive?'on':c.starting?'starting…':'off (starts by itself)'}</span> ${c.rendering?'<span class="chip warn">render running</span>':''}`;nav();render()}
function render(){const v={plan:vPlan,topics:vTopics,create:vCreate,facebook:()=>vPlat('facebook'),instagram:()=>vPlat('instagram'),youtube:()=>vPlat('youtube'),blog:vBlog,storage:vStorage,system:vSystem}[TAB]||vPlan;$('#view').innerHTML=v()}
const stChip=s=>`<span class="chip ${({ready:'ok',posted:'ok',scheduled:'gold',approved:'ok','needs images':'warn','needs review':'warn','fix QA':'bad',failed:'bad',empty:'',rendered:'warn',packaged:'warn',voiced:'warn',scripted:'warn',idea:''})[s]||''}">${esc(s)}</span>`;
// ---------- PLAN ----------
function inventory(){const inv={};for(const k of Object.keys(KIND))inv[k]={ready:0,work:0};for(const i of S.items){const k=i.format==='fb_text'?'fb_text':i.format==='carousel'?'carousel':null;if(!k)continue;const used=S.schedule.some(e=>e.item===i.id&&e.status!=='failed');if(i.state==='ready'&&!used)inv[k].ready++;else if(!used&&i.state!=='ready')inv[k].work++}for(const st of S.stories){const k=st.format==='long'?'fb_long':'reel';if(['approved','packaged'].includes(st.state))inv[k].ready++;else if(st.state!=='posted')inv[k].work++}return inv}
function vPlan(){const days={};for(const s of PLAN)(days[s.date]=days[s.date]||[]).push(s);const cnt={empty:0,scheduled:0,posted:0,failed:0};PLAN.forEach(s=>cnt[s.status]=(cnt[s.status]||0)+1);const inv=inventory(),need={};PLAN.filter(s=>s.status==='empty').forEach(s=>need[s.kind]=(need[s.kind]||0)+1);
 return `<div class="card"><h2>The month at a glance</h2><div class="row"><span class="chip">${PLAN.length} slots</span><span class="chip bad">${cnt.empty} empty</span><span class="chip gold">${cnt.scheduled} scheduled</span><span class="chip ok">${cnt.posted} posted</span><span class="chip bad">${cnt.failed||0} failed</span></div>
 <h3>What must get ready (empty slots vs items you have)</h3><table><tr><th>Format</th><th>Empty slots</th><th>Ready, unscheduled</th><th>In progress</th><th>Gap</th></tr>${Object.keys(KIND).map(k=>{const n=need[k]||0,r=inv[k].ready,g=Math.max(0,n-r);return `<tr><td>${KIND[k]}</td><td>${n}</td><td>${r}</td><td>${inv[k].work}</td><td>${g?`<span class="chip bad">${g} to make</span>`:'<span class="chip ok">covered</span>'}</td></tr>`}).join('')}</table>
 <div class="mut" style="margin-top:6px">Slots come from content/calendar.json (an IST hypothesis to test for 4 weeks). Click a slot to assign or post.</div></div>
 <div class="card">${Object.entries(days).map(([d,sl])=>`<div class="day"><div><b>${d}</b><div class="mut">${new Date(d+'T12:00:00').toLocaleDateString('en',{weekday:'short'})}</div></div><div class="slots">${sl.map(s=>`<div class="slot ${s.status}" onclick='slotOpen(${JSON.stringify(s).replace(/'/g,"&#39;")})'><b>${s.time}</b> ${KIND[s.kind]} ${stChip(s.status)}<div class="mut">${esc(s.label||'')}</div><div>${s.platforms.map(p=>`<span class="chip">${p.slice(0,2).toUpperCase()}</span>`).join('')}</div></div>`).join('')}</div></div>`).join('')}</div>`}
function slotOpen(s){const items=S.items.filter(i=>((s.kind==='fb_text'&&i.format==='fb_text')||(s.kind==='carousel'&&i.format==='carousel')));const used=id=>S.schedule.some(e=>e.item===id&&e.status!=='failed');const stor=S.stories.filter(x=>(s.kind==='reel'&&x.format==='short')||(['fb_long','yt_long'].includes(s.kind)&&x.format==='long'));
 let h=`<h2>${KIND[s.kind]}, ${s.date} ${s.time} IST</h2><div class="mut">${s.platforms.join(' + ')}</div>`;
 if(s.status==='empty'){h+=`<h3>Assign</h3><select id="as"><option value="">choose…</option>${items.filter(i=>!used(i.id)).map(i=>`<option value="item:${i.id}" ${i.state!=='ready'?'disabled':''}>${esc(i.hook||i.id)} [${i.state}]</option>`).join('')}${stor.map(x=>`<option value="story:${x.name}">${esc(x.title)} [${x.state}]</option>`).join('')}</select><div class="row" style="margin-top:8px"><button class="p" onclick='assign(${JSON.stringify(s)})'>Schedule it</button><button class="s" onclick="goCreate()">Create something for this slot</button><button class="s" onclick="closeM()">Close</button></div><div class="mut" style="margin-top:6px">Only approved, QA-clean items (with all images) can be scheduled. A queued item is posted by GitHub Actions at the time (or by <code>node tools/content/post-due.mjs</code>).</div>`}
 else{h+=`<p>${stChip(s.status)} <b>${esc(s.label||'')}</b></p>${s.entry?`<div class="row"><button class="s" onclick="unsched('${s.entry}')">Remove from schedule</button><button class="d" onclick="postNow('${s.entry}')">Post now…</button><button class="s" onclick="closeM()">Close</button></div>`:'<button class="s" onclick="closeM()">Close</button>'}`}
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div>${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
async function assign(s){const v=$('#as').value;if(!v)return alert('choose an item');const i=v.indexOf(':'),t=v.slice(0,i),id=v.slice(i+1);try{await api('/api/hub/schedule',t==='item'?{item:id,kind:s.kind,at:s.at}:{story:id,kind:s.kind,at:s.at});closeM();load()}catch(e){alert(e.message)}}
async function unsched(id){await api('/api/hub/unschedule',{id});closeM();load()}
async function postNow(id){if(!confirm('Post this to the live accounts right now?'))return;try{const r=await api('/api/hub/post-now',{id,confirm:true});alert(r.out+'\n\nstatus: '+r.entry.status+(r.entry.error?' - '+r.entry.error:''));closeM();load()}catch(e){alert(e.message)}}
function goCreate(){closeM();go('create')}
// ---------- TOPICS ----------
function vTopics(){const T=S.topics;return `<div class="card"><h2>Add topics</h2><div class="mut">One per line: <code>title | formats (comma) | pillar | english search words</code> (only the title is required). The English words pull real source passages for the brief.</div><textarea id="timp" rows="5" placeholder="गंगा ने सात पुत्रों को क्यों बहाया? | fb_text,carousel,blog | unsaid-relations | Ganga Shantanu eight children Vasus curse"></textarea><div style="margin-top:6px"><button class="p" onclick="impTopics()">Add to the topic bank</button></div></div>
 <div class="card"><h2>Topic bank (${T.length})</h2><table><tr><th>Topic</th><th>Pillar</th><th>Status</th><th>Sensitivity</th><th>Brief for a frontier model</th></tr>${T.map(t=>`<tr><td>${esc(t.title)}<div class="mut">${esc(t.slug)}${t.query?' · '+esc(t.query):''}</div>${t.note?`<div class="mut">${esc(t.note)}</div>`:''}</td><td>${esc(t.pillar)}</td><td>${stChip(t.status)}</td><td>${stChip(t.sensitivity)}</td><td>${t.sensitivity==='hold'?'<span class="mut">on hold by policy</span>':['carousel','fb_text','blog'].map(f=>`<button class="s" onclick="brief('${t.slug}','${f}')">${f}</button>`).join(' ')}</td></tr>`).join('')}</table></div>
 <div class="card" id="briefbox" style="display:${BRIEF?'block':'none'}"><h2>Prompt to paste into Claude / GPT / Gemini</h2><div class="mut">It already contains our writing rules and the real source passages. Paste the model's answer into <b>Create</b>.</div><textarea id="briefta" rows="14" readonly>${esc(BRIEF)}</textarea><div style="margin-top:6px"><button class="p" onclick="cp('briefta')">Copy</button> <button class="s" onclick="go('create')">Go to Create</button></div></div>`}
async function impTopics(){try{const r=await api('/api/hub/topics/import',{text:$('#timp').value});alert(r.added+' topic(s) added');load()}catch(e){alert(e.message)}}
async function brief(slug,format){try{BRIEF=(await api('/api/hub/topic/brief',{slug,format})).prompt;render();$('#briefbox').scrollIntoView()}catch(e){alert(e.message)}}
function cp(id){const t=$('#'+id);navigator.clipboard.writeText(t.value).then(()=>{},()=>{t.select();document.execCommand('copy')})}
// ---------- CREATE ----------
let PASTE='',ITEM=null,STATE=null;
function vCreate(){const ex=S.items.map(i=>`<option value="${i.id}" ${CUR===i.id?'selected':''}>${esc(i.id)} [${i.state}]</option>`).join('');
 return `<div class="card"><h2>1. Paste what the frontier model gave you</h2><div class="row"><select id="open" style="max-width:340px" onchange="openItem(this.value)"><option value="">…or open a saved item</option>${ex}</select><span class="mut">Labelled text (FORMAT / SLUG / HOOK / SLIDES n | text | image prompt / CLAIMS …) or JSON. The exact prompt is on the Topics tab.</span></div><textarea id="paste" rows="9" style="margin-top:8px" oninput="PASTE=this.value">${esc(PASTE)}</textarea><div style="margin-top:6px"><button class="p" onclick="readPaste()">Read it and check</button></div></div>${ITEM?vItem():''}`}
function qaList(q){return q.filter(x=>x.level!=='PASS').map(x=>`<div><span class="chip ${x.level==='FAIL'?'bad':'warn'}">${x.level}</span> <b>${esc(x.code)}</b> ${esc(x.msg)}</div>`).join('')||'<span class="chip ok">QA clean</span>'}
function vItem(){const it=ITEM,st=STATE,art=it.art||[],bust=Date.now(),slides=it.slides||[];
 return `<div class="card"><h2>2. ${esc(it.id)} ${stChip(st.state)} <span class="chip">${st.art.have}/${st.art.need} images</span></h2><div><b>${esc(it.hook||it.title||'')}</b></div><div style="margin:6px 0">${qaList(st.qa)}</div>
 <div class="row"><button class="s" onclick="saveItem()">Save as draft (content/items + content/art, the story folder)</button>${art.length?`<button class="p" onclick="genArt()">Generate images with Flux (starts it if needed)</button>`:''}${it.format==='carousel'?`<button class="s" onclick="renderCar()">Render carousel</button>`:''}</div>
 <div id="jobbox"></div>
 ${it.format==='carousel'?`<h3>Slides</h3><table>${slides.map((t,i)=>{const sh=art.find(a=>a.slide===i+1);return `<tr><td style="width:150px">${sh?`<img src="/hub/file/${it.slug}/art/${String(i+1).padStart(2,'0')}.jpg?${bust}" style="height:150px;border-radius:6px;border:1px solid var(--line)" onerror="this.style.display='none'">`:'<span class="mut">text only</span>'}</td><td><b>${i+1}.</b> ${esc(t)}${sh?`<div class="mut">${esc((sh.prompt||[sh.subject,sh.action,sh.setting,sh.lighting].join(', ')).slice(0,320))}</div><button class="s" onclick="redo(${i+1})">Redo this image</button>`:''}</td></tr>`}).join('')}</table>
 <h3>Rendered preview</h3><div class="thumbs">${slides.map((t,i)=>`<img src="/hub/file/${it.slug}/out/${String(i+1).padStart(2,'0')}.jpg?${bust}" onerror="this.style.display='none'">`).join('')}</div>`:`<h3>Text</h3><pre>${esc([it.hook,...(it.body_lines||[]),it.cta,it.source_line,(it.hashtags||[]).join(' ')].filter(Boolean).join('\n'))}</pre>`}
 <h3>3. Approve and schedule</h3><div class="row"><button class="p" ${st.fails||st.state==='needs images'?'disabled':''} onclick="approve(true)">I checked it: approve</button><button class="s" onclick="approve(false)">Back to draft</button><span class="mut">Checklist: source read, variants named, no mockery, hook keeps its promise, CTA is a question or save, Devanagari correct, AI pictures looked at.</span></div>
 <div class="row" style="margin-top:8px"><select id="sk" style="max-width:170px"><option value="${it.format==='fb_text'?'fb_text':'carousel'}">${it.format==='fb_text'?'FB text':'Carousel (FB + IG)'}</option></select><input id="sat" type="datetime-local" style="max-width:220px"><label><input type="checkbox" id="pfb" checked style="width:auto"> Facebook</label><label><input type="checkbox" id="pig" style="width:auto" ${it.format==='fb_text'?'disabled':''}> Instagram</label><button class="s" onclick="schedItem()">Schedule</button><button class="d" onclick="postItem()">Post now…</button></div><div class="mut">Instagram needs the slides at public URLs (blog host) and publishes immediately; Facebook can be scheduled up to 29 days ahead.</div></div>${it.format==='carousel'?vReel():''}`}
async function readPaste(){try{const r=await api('/api/hub/paste/parse',{text:PASTE});ITEM=r.item;STATE=r.state;CUR=null;render();$('#paste').value=PASTE}catch(e){alert(e.message)}}
async function openItem(id){if(!id)return;const r=await api('/api/hub/item/'+id);ITEM=r.item;STATE=r.state;CUR=id;PASTE='';RS=null;render();loadReel()}
async function saveItem(){try{const r=await api('/api/hub/item/save',{item:ITEM,overwrite:true});STATE=r.state;CUR=ITEM.id;S=await api('/api/hub/state');render()}catch(e){alert(e.message)}}
async function genArt(){try{await saveItem();const r=await api('/api/hub/item/art',{id:ITEM.id});JOB=r.job;pollJob()}catch(e){alert(e.message)}}
async function redo(n){try{await api('/api/hub/item/prompt',{id:ITEM.id,slide:n,redo:true});const r=await api('/api/hub/item/art',{id:ITEM.id,only:[n],force:true});JOB=r.job;pollJob()}catch(e){alert(e.message)}}
async function renderCar(){try{await api('/api/hub/item/render',{id:ITEM.id});await openItem(ITEM.id)}catch(e){alert(e.message)}}
async function approve(a){try{await saveItem();await api('/api/hub/item/approve',{id:ITEM.id,approve:a});await openItem(ITEM.id);load()}catch(e){alert(e.message)}}
function plats(){const pl=[];if($('#pfb').checked)pl.push('facebook');if($('#pig').checked&&!$('#pig').disabled)pl.push('instagram');return pl}
async function schedItem(){const at=$('#sat').value;if(!at)return alert('pick a date and time (your local time)');try{const r=await api('/api/hub/schedule',{item:ITEM.id,kind:$('#sk').value,platforms:plats(),at:new Date(at).toISOString()});alert('Scheduled: '+r.scheduled+'\n'+r.note);load()}catch(e){alert(e.message)}}
async function postItem(){const pl=plats();if(!confirm('Post "'+ITEM.id+'" to '+pl.join(' + ')+' right now (live)?'))return;try{const r=await api('/api/hub/schedule',{item:ITEM.id,kind:$('#sk').value,platforms:pl,at:new Date(Date.now()+60000).toISOString()});const p=await api('/api/hub/post-now',{id:r.scheduled,confirm:true});alert(p.out+'\n\nstatus: '+p.entry.status+(p.entry.error?' - '+p.entry.error:''));load()}catch(e){alert(e.message)}}
let poller=null;function pollJob(){clearInterval(poller);poller=setInterval(async()=>{const j=await api('/api/hub/jobs');const job=j.jobs.find(x=>x.id===JOB)||j.jobs[0];const b=$('#jobbox');if(b&&job)b.innerHTML=`<div class="card"><b>${esc(job.name)}</b> ${stChip(job.status==='running'?'scripted':job.status==='done'?'ready':'failed')}<pre>${esc((job.log||[]).slice(-8).join('\n'))}</pre></div>`;if(job&&job.status!=='running'){clearInterval(poller);if(ITEM)openItem(ITEM.id)}},3000)}

// ---------- REEL FROM CAROUSEL ----------
let RS=null,NBRIEF='';
async function loadReel(){if(ITEM&&ITEM.format==='carousel'){try{RS=await api('/api/hub/reel/status?id='+ITEM.id)}catch{RS=null}render()}}
function stepChip(ok,l){return `<span class="chip ${ok?'ok':''}">${ok?'✓':'·'} ${l}</span>`}
function vReel(){const r=RS;if(!r||r.error)return '<div class="card"><h2>Reel (75-90 s)</h2><div class="mut">Loading…</div></div>';
 const s=r.steps;return `<div class="card"><h2>Make a 75-90 s reel from this carousel (YouTube Shorts, Instagram, Facebook)</h2><div class="mut">Stippled paintings that form from dots, kinetic Devanagari headlines on the beat, word-lit captions, emotional Hindi voice, designed sound. One click runs: stipple the art, voice, sound, render, QA, cover and the publishing package. Takes about 30-40 minutes on this Mac (voice about 15-20, render 10-15) and runs in the background.</div>
 <div style="margin:8px 0">${stepChip(r.narration,'narration '+(r.words?r.words+' words ≈ '+r.est_seconds+' s':''))}${stepChip(s.prepared,'prepared')}${stepChip(s.voice,'voice'+(r.duration?' '+r.duration+' s':''))}${stepChip(s.video,'video')}${stepChip(s.qa,'QA passed')}${stepChip(s.packaged,'package')}</div>
 ${r.narration?'':`<h3>Step 1: the narration (one spoken line per slide)</h3><div class="row"><button class="s" onclick="nbrief()">Get the prompt for Claude / GPT</button></div>${NBRIEF?`<textarea id="nbta" rows="8" readonly>${esc(NBRIEF)}</textarea><button class="p" style="margin-top:6px" onclick="cp('nbta')">Copy prompt</button>`:''}<h3>Paste the answer</h3><textarea id="nbin" rows="7" placeholder="NARRATION:\n1 | [hook] ...\n2 | ..."></textarea><button class="p" style="margin-top:6px" onclick="saveNar()">Save narration</button>`}
 ${r.narration?`<div class="row"><button class="p" onclick="makeReel(false)">${(r.art.need&&r.art.have<r.art.need)?'Make everything: images + carousel + reel':'Make the reel'}</button><label><input type="checkbox" id="rv" style="width:auto"> redo the voice</label><button class="s" onclick="loadReel()">Refresh status</button></div>${(r.art.need&&r.art.have<r.art.need)?'<div class="mut">'+(r.art.need-r.art.have)+' image(s) still to generate: this button does it first (Flux starts and stops by itself), then renders the carousel and builds the reel, all in one run.</div>':''}<div id="reeljob"></div>`:''}
 ${r.mp4?`<h3>Result</h3><div class="row" style="align-items:flex-start"><video src="${r.mp4}?${Date.now()}" controls style="width:270px;border-radius:10px;border:1px solid var(--line)"></video><div><div class="mut">${r.story?esc(r.story.state):''} · ${r.duration||'?'} s</div>${r.cover?`<div class="mut">cover:</div><img src="${r.cover}" style="height:120px;border-radius:6px">`:''}<div class="row" style="margin-top:8px"><input id="rat" type="datetime-local" style="max-width:210px"><button class="s" onclick="schedReel()">Schedule as Reel (FB + IG)</button></div><div class="mut">The 'Reels' slots in the Plan use it. YouTube Short upload and the thumbnail check are in the <a href="/dash" style="color:var(--gold)">dashboard</a> (Publish tab, story ${esc(r.name)}).</div></div></div>`:''}</div>`}
async function nbrief(){try{NBRIEF=(await api('/api/hub/reel/brief?id='+ITEM.id)).prompt;render()}catch(e){alert(e.message)}}
async function saveNar(){try{const r=await api('/api/hub/reel/narration',{id:ITEM.id,text:$('#nbin').value});ITEM=(await api('/api/hub/item/'+ITEM.id)).item;STATE=r.state;RS=r.status;render()}catch(e){alert(e.message)}}
async function makeReel(){if(!confirm('Start the build? Images (if missing), carousel, voice, animation, render, QA and package run by themselves, about 30-60 minutes of Mac time.'))return;try{await saveItem();const r=await api('/api/hub/reel/make',{id:ITEM.id,redoVoice:$('#rv').checked});JOB=r.job;pollReel()}catch(e){alert(e.message)}}
let rpoll=null;function pollReel(){clearInterval(rpoll);rpoll=setInterval(async()=>{const j=await api('/api/hub/jobs');const job=j.jobs.find(x=>x.id===JOB)||j.jobs[0];const b=$('#reeljob');if(b&&job)b.innerHTML=`<div class="card"><b>${esc(job.name)}</b> ${stChip(job.status==='running'?'scripted':job.status==='done'?'ready':'failed')}<pre>${esc((job.log||[]).slice(-12).join('\n'))}</pre></div>`;if(job&&job.status!=='running'){clearInterval(rpoll);loadReel()}},5000)}
async function schedReel(){const at=$('#rat').value;if(!at)return alert('pick a date and time');try{const r=await api('/api/hub/schedule',{story:RS.name,kind:'reel',at:new Date(at).toISOString()});alert('Scheduled: '+r.scheduled);load()}catch(e){alert(e.message)}}
// ---------- PLATFORM PAGES ----------
function vPlat(pl){const slots=PLAN.filter(s=>s.platforms.includes(pl)),c={};slots.forEach(s=>c[s.status]=(c[s.status]||0)+1);
 const fmt={facebook:['fb_text','carousel'],instagram:['carousel'],youtube:[]}[pl],its=S.items.filter(i=>fmt.includes(i.format)),vid=S.stories.filter(x=>pl==='instagram'?x.format==='short':true);
 const lim={facebook:'Reels 30/day (API), 3-90 s; photos JPEG; no links in the post; schedule 10 min-29 days',instagram:'carousel 2-10 images at PUBLIC urls; posting quota 100/24 h (docs say carousel cap 50); Reels publish immediately; caption 2200',youtube:'10,000 quota units/day: about 6 uploads (1,600 each); thumbnail 50; an unaudited API project keeps uploads private; chapters first 0:00, >=3, each >=10 s'}[pl];
 const planRows=slots.map(s=>`<span class="slot ${s.status}" style="display:inline-block;margin:2px" onclick='slotOpen(${JSON.stringify(s).replace(/'/g,"&#39;")})'><b>${s.date.slice(5)} ${s.time}</b> ${KIND[s.kind]} ${stChip(s.status)}</span>`).join('');
 return `<div class="card"><h2>${pl[0].toUpperCase()+pl.slice(1)}: next 30 days</h2><div class="row"><span class="chip">${slots.length} slots</span><span class="chip bad">${c.empty||0} empty</span><span class="chip gold">${c.scheduled||0} scheduled</span><span class="chip ok">${c.posted||0} posted</span><span class="chip bad">${c.failed||0} failed</span></div><div class="mut" style="margin:6px 0">${lim}</div><div>${planRows||'<span class="mut">no slots</span>'}</div></div>
 ${fmt.length?`<div class="card"><h2>Posts for ${pl}: what is ready and what needs work</h2><table><tr><th>Item</th><th>Format</th><th>State</th><th>Images</th><th></th></tr>${its.map(i=>`<tr><td>${esc(i.hook||i.id)}<div class="mut">${esc(i.id)}</div></td><td>${i.format}</td><td>${stChip(i.state)}</td><td>${i.art.need?i.art.have+'/'+i.art.need:'-'}</td><td><button class="s" onclick="openIn('${i.id}')">Open</button></td></tr>`).join('')||'<tr><td colspan=5 class="mut">nothing yet: add topics, get a brief, paste the answer in Create</td></tr>'}</table></div>`:''}
 <div class="card"><h2>Videos (${pl==='youtube'?'Shorts and long':pl==='instagram'?'Reels':'Reels and long'})</h2><table><tr><th>Story</th><th>Type</th><th>Pipeline state</th><th>${pl==='youtube'?'YouTube':'Meta'}</th></tr>${vid.map(x=>`<tr><td>${esc(x.title)}<div class="mut">${x.name}</div></td><td>${x.format}</td><td>${stChip(x.state)}</td><td>${pl==='youtube'?(x.youtube?`<a href="${x.youtube.url}" target="_blank" style="color:var(--gold)">${x.youtube.privacy}</a>`:'-'):(x.meta?Object.entries(x.meta).filter(([k])=>['facebook','instagram'].includes(k)).map(([k,v])=>`<span class="chip ok">${k} ${esc(v.state||'posted')}</span>`).join(''):'-')}</td></tr>`).join('')}</table><div class="mut">Package, thumbnail approval and upload for videos stay in the <a href="/dash" style="color:var(--gold)">dashboard</a> (Publish and Manual upload kit tabs).</div></div>`}
async function openIn(id){go('create');await openItem(id)}
// ---------- BLOG ----------
let BLOGR=null,BLOGT='';
function vBlog(){return `<div class="card"><h2>Publish a blog post to your subdomain</h2><div class="mut">Paste the article in the labelled format (TITLE, META, TRADITION, MARKDOWN…; the Topics tab builds the brief for a frontier model). Validate runs our QA and the Google News checklist; Publish saves, builds the site and pushes it: Cloudflare Pages (connected to the repo once) serves the subdomain.</div><textarea id="bpaste" rows="10" oninput="BLOGT=this.value">${esc(BLOGT)}</textarea><div class="row" style="margin-top:6px"><input id="bhero" placeholder="hero image path, e.g. /img/my-post/hero.jpg (optional)" style="max-width:340px"><input id="bhook" placeholder="timely hook: Navratri 2026, Ekadashi, anniversary (optional)" style="max-width:340px"><button class="p" onclick="blogValidate()">Validate</button></div></div>${BLOGR?`<div class="card"><h2>${esc(BLOGR.item.title||BLOGR.item.id)}</h2><div>${qaList(BLOGR.qa)}</div><h3>Google News / Discover checklist</h3>${BLOGR.news.map(c=>`<div><span class="chip ${c.ok?'ok':'warn'}">${c.ok?'ok':'check'}</span> ${esc(c.name)} <span class="mut">${esc(c.detail)}</span></div>`).join('')}<div class="row" style="margin-top:10px"><button class="s" onclick="blogPreview()">Preview</button><button class="d" onclick="blogPublish()">Publish to the subdomain…</button></div></div>`:''}<div class="card"><h2>One-time domain setup (done in Cloudflare; no token needed here)</h2><ol class="mut"><li>Cloudflare dashboard > Workers & Pages > Create > Pages > <b>Connect to Git</b> > pick <code>swapnilpatil94/creator-studio</code>, branch <code>${esc(S.config.blog.branch)}</code> (later main).</li><li>Build command <code>node blog/build.mjs</code>, output directory <code>blog/dist</code>, variable <code>NODE_VERSION=22</code>.</li><li>Pages > Custom domains > add your subdomain (Cloudflare adds the CNAME if the domain is on Cloudflare; otherwise add a CNAME to <code>&lt;project&gt;.pages.dev</code>).</li><li>Put the same address in <code>blog/site.json</code> (domain) and the contact email.</li><li>Google Search Console: add the subdomain, submit <code>/sitemap.xml</code> and <code>/news-sitemap.xml</code>; Publisher Center for Google News once there are real posts.</li></ol><div class="mut">Google decides News inclusion; evergreen mythology is a weaker fit than timely pieces (festivals, tithis, anniversaries), so use the timely hook field.</div></div>`}
async function blogValidate(){try{BLOGR=await api('/api/hub/blog/validate',{text:BLOGT,hero_image:$('#bhero').value||undefined,timely_hook:$('#bhook').value||undefined});render();$('#bpaste').value=BLOGT}catch(e){alert(e.message)}}
async function blogPreview(){try{const r=await api('/api/hub/blog/preview',{item:BLOGR.item});window.open(r.url,'_blank')}catch(e){alert(e.message)}}
async function blogPublish(){if(!confirm('Publish this post? It is saved, built, committed and pushed; the live site updates in about a minute.'))return;try{const r=await api('/api/hub/blog/publish',{item:BLOGR.item,confirm:true});alert('Published '+r.published+'\n'+r.note+'\n'+(r.push||''))}catch(e){alert(e.message)}}
// ---------- STORAGE & LIMITS ----------
let STO=null,LIM=null;
function vStorage(){if(!STO){api('/api/hub/storage').then(x=>{STO=x;render()});api('/api/hub/limits').then(x=>{LIM=x;render()});return '<div class="card">Measuring…</div>'}
 const gb=b=>(b/1e9).toFixed(2)+' GB';return `<div class="card"><h2>Storage</h2><div class="row"><span class="chip">${gb(STO.disk.free_bytes)} free (${STO.disk.used_pct} used)</span><span class="chip gold">${gb(STO.reclaim_bytes)} can be reclaimed</span></div><div class="mut">Rules: delete render frames once the mp4 passed QA; rebuilt bundles; rendered slides (rebuilt from art + text); ComfyUI's duplicate PNGs; art of posts older than ${S.config.retention.posted_art_days} days. The pipeline can always rebuild them.</div><table><tr><th>Path</th><th>Why</th><th>Size</th></tr>${STO.rows.map(r=>`<tr><td>${esc(r.path)}</td><td class="mut">${esc(r.why)}</td><td>${gb(r.bytes)}</td></tr>`).join('')}</table><div class="row" style="margin-top:8px"><button class="s" onclick="clean(true)">Dry run</button><button class="d" onclick="clean(false)">Clean now</button></div><h3>Where space goes</h3><div class="row">${Object.entries(STO.sizes).map(([k,v])=>`<span class="chip">${k}: ${gb(v)}</span>`).join('')}</div></div>
 <div class="card"><h2>API limits and known issues</h2><table><tr><th>Platform</th><th>Rule</th><th>Evidence</th></tr>${(LIM?LIM.limits:[]).map(l=>`<tr><td>${esc(l.platform)}</td><td>${esc(l.rule)}</td><td class="mut">${esc(l.level)}<br>${esc(l.src)}</td></tr>`).join('')}</table>${LIM?`<h3>Live</h3><pre>${esc(JSON.stringify(LIM.live,null,1))}</pre>`:''}</div>`}
async function clean(dry){if(!dry&&!confirm('Delete the listed files? They are regenerable intermediates.'))return;try{STO=await api('/api/hub/storage/clean',{dryRun:dry});render();if(!dry){STO=null;render()}}catch(e){alert(e.message)}}
// ---------- SYSTEM ----------
let GHA=null;
function vSystem(){if(!GHA){api('/api/hub/gha').then(x=>{GHA=x;render()});}const c=S.comfy;return `<div class="card"><h2>Flux (ComfyUI)</h2><div class="row"><span class="chip ${c.alive?'ok':'warn'}">${c.alive?'running':'stopped'}</span><span class="mut">It starts when you generate images and stops by itself after ${c.idle_stop_minutes} idle minutes; it refuses to start during a video render (shared 24 GB RAM). The first start after a reboot can take 10-20 minutes.</span></div><div class="row" style="margin-top:8px"><button class="s" onclick="comfyAct('start')">Start now</button><button class="s" onclick="comfyAct('stop')">Stop now (frees about 8 GB)</button></div></div>
 <div class="card"><h2>Recent jobs</h2>${S.jobs.map(j=>`<div>${stChip(j.status==='running'?'scripted':j.status==='done'?'ready':'failed')} <b>${esc(j.name)}</b><pre>${esc((j.log||[]).slice(-5).join('\n'))}</pre></div>`).join('')||'<span class="mut">none</span>'}</div>
 <div class="card"><h2>GitHub Actions (recent)</h2>${GHA?(GHA.runs.map(r=>`<div><span class="chip ${r.conclusion==='success'?'ok':r.status==='in_progress'?'warn':'bad'}">${r.conclusion||r.status}</span> ${esc(r.workflowName)} <span class="mut">${esc(r.headBranch)} · ${esc(r.createdAt)}</span> <a style="color:var(--gold)" href="${r.url}" target="_blank">open</a></div>`).join('')||esc(GHA.error||'none')):'loading…'}<div class="mut" style="margin-top:6px">Scheduled workflows run only from <code>main</code>. Until then use a branch named <code>e2e/…</code> to test.</div></div>`}
async function comfyAct(a){try{const r=await api('/api/hub/comfy',{action:a});if(r.job){JOB=r.job;alert('Starting; this can take a while. Watch Recent jobs.')}load()}catch(e){alert(e.message)}}
load();setInterval(()=>{if(TAB==='system'&&!$('#modal').innerHTML)load()},20000);
</script></body></html>
