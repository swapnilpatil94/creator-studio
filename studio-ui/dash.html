<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Channel Dashboard</title>
<style>
:root{--bg:#0e0f12;--fg:#e8e6e1;--mut:#8b8f98;--card:#17191e;--line:#2a2d35;--acc:#e8b04a;--ok:#6fcf97;--bad:#eb5757;--warn:#f2c94c}
@media (prefers-color-scheme:light){:root{--bg:#f6f5f1;--fg:#1b1c1f;--mut:#666b75;--card:#fff;--line:#dcdad2;--acc:#a66a00;--ok:#1f8f4d;--bad:#c0392b;--warn:#9a6b00}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}a{color:var(--acc)}.mut{color:var(--mut);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}nav button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:99px;padding:6px 14px;font:inherit;cursor:pointer}nav button.on{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button.p,button.s{font:inherit;padding:7px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg)}button.p{background:var(--acc);color:#111;border:0;font-weight:600}button:disabled{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--mut);font-weight:500}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.cols{grid-template-columns:1fr}}
.chip{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mut);margin:1px}.ok{color:var(--ok);border-color:var(--ok)}.bad{color:var(--bad);border-color:var(--bad)}.warn{color:var(--warn);border-color:var(--warn)}
.item{border-top:1px solid var(--line);padding:10px 0}.item:first-child{border-top:0}.stages{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.st{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--line);color:var(--mut)}.st.y{background:var(--ok);color:#06170c}
input,select,textarea{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;font-size:12px;white-space:pre-wrap}
img.th{border-radius:8px;border:1px solid var(--line);max-width:100%}label{font-size:12px;color:var(--mut);display:block;margin:8px 0 3px}
</style></head><body>
<h1>Channel dashboard <a class="mut" href="/">← Studio</a> · <a class="mut" href="/voice">Voice</a></h1>
<div class="mut" id="sub"></div>
<nav id="nav"></nav>
<div id="view"></div>
<script>
const $=s=>document.querySelector(s),j=async(u,o)=>{const r=await fetch(u,o);const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d},post=(u,b)=>j(u,{method:'POST',body:JSON.stringify(b||{})});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,YT=null,TAB=(location.hash||'#week').slice(1),SEL=null;
const TABS=[['week','This week'],['next','Next topics (data)'],['searches','Searches'],['publish','Publish & upload']];
async function load(){D=await j('/api/dash');try{YT=await j('/api/yt/status')}catch(e){YT={error:e.message}}render()}
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===TAB?'on':''}" onclick="TAB='${k}';location.hash='${k}';render()">${l}</button>`).join('')}
const fmt=n=>n==null?'–':Number(n).toLocaleString();
function stageChips(it){return `<div class="stages">${it.stages.map(s=>`<span class="st ${s.ok?'y':''}">${s.n}</span>`).join('')}</div>`}
function weekCol(ch,fm){const a=D.items.filter(i=>i.channel===ch&&i.format===fm);if(!a.length)return '';return `<div class="card"><h2>${ch==='kathaaya'?'KATHAAYA':'Agentic AI'} · ${fm==='short'?'Shorts':'Long form'}</h2>${a.map(i=>`<div class="item"><b>${esc(i.day)}</b> · ${esc(i.title)}
 <div class="mut">${esc(i.why)}</div>
 <div>${i.data?`<span class="chip">demand ${fmt(i.data.medViewsPerDay)} views/day</span><span class="chip">${i.data.ge1M}/25 ≥1M</span><span class="chip ${i.data.format!==i.format?'warn':''}">data favours ${i.data.format} (${i.data.shortShare}% shorts)</span>${i.data.event?`<span class="chip warn">${esc(i.data.event.name)} in ${i.data.event.inDays}d</span>`:''}`:'<span class="chip">no search data for this topic</span>'}
 <span class="chip ${i.status==='uploaded'?'ok':''}">${esc(i.status)}</span>${i.story?(i.strictGates?'<span class="chip ok">strict gates</span>':'<span class="chip warn">not built under strict gates</span>'):'<span class="chip">no story yet</span>'}
 ${i.upload?`<a class="chip ok" href="${esc(i.upload.url)}" target="_blank">uploaded (${esc(i.upload.privacy)})</a>`:''}</div>${stageChips(i)}</div>`).join('')}</div>`}
function vWeek(){return `<div class="mut">Week ${esc(D.week)}. Basis: ${esc(D.basis)}. Status is read from the files in each story folder (not typed by hand).</div><div class="cols"><div>${weekCol('kathaaya','short')}${weekCol('kathaaya','long')}</div><div>${weekCol('agentic-ai','long')}${weekCol('agentic-ai','short')}</div></div>`}
function vNext(){const r=D.nextTopics.rows||[];return `<div class="card"><div class="row"><b>Ranked from your saved searches + festival calendar</b> <button class="s" onclick="post('/api/dash/next-topics').then(load)">Recompute</button></div><div class="mut">${esc(D.nextTopics.method||'')} · computed ${esc(D.nextTopics.date||'never')}. Score = 0.5·log(median views/day) + 0.3·(share ≥1M) + 0.2·log(views per sub), ×1.25 if a festival is within 5 days, ×1.15 within 14.</div>
<table><tr><th>score</th><th>channel</th><th>topic (search query)</th><th>views/day</th><th>≥1M of 25</th><th>views/sub</th><th>shorts %</th><th>format</th><th>festival</th></tr>${r.map(x=>`<tr><td>${x.score}</td><td>${esc(x.channel)}</td><td>${esc(x.topic)}</td><td>${fmt(x.medViewsPerDay)}</td><td>${x.ge1M}</td><td>${x.medViewsPerSub}</td><td>${x.shortShare}%</td><td><span class="chip">${x.format}</span></td><td>${x.event?esc(x.event.name)+' in '+x.event.inDays+'d':''}</td></tr>`).join('')}</table>
<div class="mut" style="margin-top:8px">Caveats: search shows the most-viewed videos in the window (survivorship bias); competition is not measured; this is a ranking aid, not a forecast.</div></div>
<div class="card"><h2>Festival calendar</h2><div class="mut">${esc(D.calendar.source)}</div>${D.calendar.events.map(e=>`<span class="chip">${esc(e.date)} · ${esc(e.name)}</span>`).join('')}</div>`}
function vSearches(){return `<div class="card"><h2>Run a new search</h2><div class="cols"><div><label>Channel</label><select id="rch"><option>kathaaya</option><option>agentic-ai</option></select><label>Label (a-z, 0-9, -)</label><input id="rlab" value="manual-${new Date().toISOString().slice(0,10)}"><label>Window days</label><input id="rdays" type="number" value="120"></div><div><label>Queries, one per line (max 12). Each costs 100 API quota units of 10,000/day.</label><textarea id="rq" rows="5" placeholder="कर्ण कवच कुंडल कथा"></textarea></div></div><button class="p" style="margin-top:10px" onclick="runSearch()">Run search (uses quota)</button> <span class="mut" id="rnote"></span><pre id="rlog" style="display:none"></pre></div>
${D.searches.map(s=>`<div class="card"><h2>${esc(s.label)} <span class="chip">${esc(s.channel)}</span> <span class="chip">${esc(s.date)}</span> <span class="chip">${s.videos} videos</span> <span class="chip">${s.quotaUnits} quota units</span></h2><div class="mut">Queries: ${s.queries.map(esc).join(' · ')} · window ${s.days} days · language ${esc(s.lang)}</div><table><tr><th>top outlier (views per subscriber)</th><th>channel</th><th>views</th><th>subs</th><th>fmt</th></tr>${s.topOutliers.map(v=>`<tr><td><a href="${esc(v.url)}" target="_blank">${esc(v.title.slice(0,80))}</a></td><td>${esc(v.channel)}</td><td>${fmt(v.views)}</td><td>${fmt(v.subs)}</td><td>${v.format}</td></tr>`).join('')}</table></div>`).join('')}`}
async function runSearch(){try{const q=$('#rq').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!q.length)return alert('add queries');if(!confirm('This uses about '+(q.length*100+40)+' YouTube API quota units. Continue?'))return;await post('/api/dash/research',{confirm:true,channel:$('#rch').value,label:$('#rlab').value,days:+$('#rdays').value,queries:q});$('#rnote').textContent='running…';$('#rlog').style.display='';poll()}catch(e){alert(e.message)}}
let tm;function poll(){clearInterval(tm);tm=setInterval(async()=>{const jb=await j('/api/job');if(!jb)return;const el=$('#rlog')||$('#ulog');if(el){el.style.display='';el.textContent=jb.lines.slice(-30).join('\n')}if(jb.status!=='running'){clearInterval(tm);load()}},1500)}
function vPublish(){const st=D.stories.filter(s=>s.seed||s.hasPublish);if(!SEL||!st.find(s=>s.id===SEL))SEL=(st[0]||{}).id;const s=st.find(x=>x.id===SEL);const p=s&&s.publish;
 const yh=YT&&YT.connected?`<span class="chip ok">connected: ${(YT.channels||[]).map(c=>esc(c.title)+' ('+esc(c.handle||c.id)+', '+fmt(c.subs)+' subs, '+c.videos+' videos)').join(', ')||'?'}</span> <button class="s" onclick="post('/api/yt/disconnect').then(load)">Disconnect</button>`:`<span class="chip ${YT&&YT.oauthConfigured?'warn':'bad'}">${YT&&YT.oauthConfigured?'not connected':'OAuth client not configured'}</span> <button class="p" onclick="connect()" ${YT&&YT.oauthConfigured?'':'disabled'}>Connect YouTube</button>`;
 const head=`<div class="card"><h2>YouTube connection</h2>${yh}<div class="mut" style="margin-top:6px">Upload needs OAuth consent by you in Google's own page (I cannot and will not click it for you). Redirect URI that must be registered in your OAuth client: <code>${esc(YT&&YT.redirect||'')}</code>. Uploads are <b>private/unlisted only</b>; make public in YouTube Studio. Target channel: <b>${esc(D.handle||'')}</b> (${esc(D.channelId||'')}); the account that signs in is what counts.</div></div>
 <div class="card"><label>Story</label><select onchange="SEL=this.value;render()">${st.map(x=>`<option ${x.id===SEL?'selected':''}>${x.id}</option>`).join('')}</select><div style="margin-top:10px"><button class="p" onclick="act('thumbnail')">1 · Make thumbnails</button> <button class="p" onclick="act('seo')">2 · Build SEO package</button></div></div>`;
 if(!p)return head+'<div class="card mut">No publish package yet: run steps 1 and 2.</div>';
 const th=s.thumbCheck, stamp=Date.now(), brand=D.brand||{};
 const has169=(p.thumbnails||[]).some(t=>t.includes('16x9')), brandLogo=brand.logo?`<img src="${esc(brand.logo.url)}" style="width:36px;height:36px;border-radius:50%">`:'';
 const feed=`<div class="card"><h2>Preview as viewers will see it</h2><div class="cols"><div>${has169?`<div class="mut">Feed card (16:9 thumbnail, title as cut on mobile)</div><div style="max-width:380px"><img class="th" style="width:100%" src="/dash/file/${s.id}/thumb-16x9.png?x=${stamp}"><div style="display:flex;gap:10px;margin-top:8px">${brandLogo}<div><div style="font-weight:600;line-height:1.3">${esc(p.title)}</div><div class="mut">${esc(D.handle||'')} · 0 views · just now</div></div></div></div>`:`<div class="mut">Shorts shelf card (9:16)</div><div style="max-width:200px"><img class="th" style="width:100%" src="/dash/file/${s.id}/thumb-9x16.png?x=${stamp}"><div style="font-weight:600;line-height:1.3;margin-top:6px;font-size:13px">${esc(p.title)}</div><div class="mut">0 views</div></div>`}
  <div class="mut" style="margin-top:12px">120 px test (how small it first appears)</div>${has169?`<img src="/dash/file/${s.id}/thumb-120-16x9.png?x=${stamp}" style="border:1px solid var(--line)"> `:''}<img src="/dash/file/${s.id}/thumb-120-9x16.png?x=${stamp}" style="border:1px solid var(--line);height:120px"></div>
  <div><div class="mut">Shorts cover (9:16, 1080x1920)</div><img class="th" style="max-height:480px" src="/dash/file/${s.id}/thumb-9x16.png?x=${stamp}"><div class="mut" style="margin-top:12px">The film</div>${p.video?`<video controls preload="metadata" style="max-height:420px;max-width:100%;border-radius:8px;border:1px solid var(--line)" src="/dash/file/${s.id}/${esc(p.video.replace('output/',''))}"></video>`:'<div class="mut">no video</div>'}</div></div></div>`;
 const pack=`<div class="card"><h2>Package</h2><div class="cols"><div><label>Title options (pick one: tags/description rebuild)</label>${p.titleOptions.map((t,i)=>`<div><label style="display:flex;gap:8px;color:var(--fg)"><input type="radio" name="tt" style="width:auto" ${t.t===p.title?'checked':''} onchange="post('/api/dash/title',{story:'${s.id}',index:${i}}).then(load)"> ${esc(t.t)} <span class="mut">(${esc(t.formula)})</span></label></div>`).join('')}<label>Thumbnail text (line 1 white / line 2 gold, ≤4 words total)</label><div class="cols"><input id="l1" value="${esc((s.seed&&s.seed.thumbnail||{}).line1||'')}"><input id="l2" value="${esc((s.seed&&s.seed.thumbnail||{}).line2||'')}"></div><label>Parchment note (small text, ≤5 words)</label><input id="nt" value="${esc((s.seed&&s.seed.thumbnail||{}).note||'')}"><label>Painting id (assets/color/NN.jpg; empty = film frame)</label><input id="im" value="${esc((s.seed&&s.seed.thumbnail||{}).image||'')}"><label>Frame time (s, film-frame mode)</label><input id="tt0" type="number" step="0.5" value="${esc((s.seed&&s.seed.thumbnail||{}).t||5)}"><button class="s" style="margin-top:8px" onclick="rethumb()">Re-make thumbnails with this text/frame</button>
  <label>Description</label><pre>${esc(p.description)}</pre></div><div><label>Tags (${p.tags.length}; used by ≥2 winning videos for the topic, plus curated)</label><div>${p.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div><label>Tag evidence</label><div class="mut">${(p.tagEvidence||[]).map(t=>esc(t.t)+' ×'+t.n).join(' · ')||'none'}</div><label>Flags sent to YouTube</label><div class="mut">category ${esc(p.categoryId)} · language ${esc(p.defaultLanguage)} · made for kids: ${p.selfDeclaredMadeForKids} · containsSyntheticMedia: ${p.containsSyntheticMedia} · privacy: private</div></div></div></div>`;
 const rv=s.review&&s.review.valid?s.review:null, ticks=rv?rv.ticks:[];
 const skills=`<div class="card"><h2>Skills applied and checks</h2><div class="mut">Skills recorded as read for this stage: ${(s.publishSkills||[]).map(x=>`<span class="chip ok">${esc(x)}</span>`).join('')||'<span class="chip bad">none</span>'} · built with: ${(p.skillsApplied||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>
 <div class="cols"><div><label>Automated checks (rules from the skills)</label>${p.checks.map(c=>`<div><span class="chip ${c.ok?'ok':'warn'}">${c.ok?'PASS':'WARN'}</span> ${esc(c.name)} <span class="mut">${esc(c.detail)}</span></div>`).join('')}</div>
 <div><label>Your review (all must be ticked to approve)</label>${(p.reviewItems||[]).map((t,i)=>`<label style="display:flex;gap:8px;color:var(--fg);font-size:13px;margin:4px 0"><input type="checkbox" class="rv" style="width:auto" ${ticks[i]?'checked':''}> ${esc(t)}</label>`).join('')}<button class="p" onclick="approve(true)">Approve package</button> <button class="s" onclick="approve(false)">Save without approving</button> ${rv&&rv.approved?'<span class="chip ok">approved '+esc(rv.at.slice(0,16))+'</span>':'<span class="chip warn">not approved (changing anything voids approval)</span>'}</div></div></div>`;
 const up=`<div class="card"><h2>Upload</h2>${s.upload?`<span class="chip ok">uploaded ${esc(s.upload.privacy)}</span> <a href="${esc(s.upload.url)}" target="_blank">${esc(s.upload.url)}</a> <span class="mut">thumbnail: ${esc(s.upload.thumbnail)}</span>`:''}
 <div class="cols"><div><label>Visibility</label><select id="priv"><option>private</option><option>unlisted</option></select><label style="display:flex;gap:8px;color:var(--fg)"><input id="ack" type="checkbox" style="width:auto"> I accept the claims warnings (sources not opened at verse level; the description carries the variant note).</label></div>
 <div><button class="s" onclick="upload(true)">Show the exact request (dry run, nothing sent)</button> <button class="p" onclick="upload(false)" ${YT&&YT.connected&&rv&&rv.approved?'':'disabled'}>Upload to YouTube</button><div class="mut" style="margin-top:6px">Enabled only when YouTube is connected AND the package is approved. Quota about 1,650 of 10,000 units/day.</div></div></div><pre id="ulog" style="display:none"></pre></div>`;
 return head+feed+pack+skills+up}
function rethumb(){post('/api/dash/thumbnail',{story:SEL,text:'',line1:$('#l1').value,line2:$('#l2').value,note:$('#nt').value,image:$('#im').value,t:+$('#tt0').value}).then(()=>post('/api/dash/seo',{story:SEL})).then(load).catch(e=>alert(e.message))}
async function approve(a){try{await post('/api/dash/review',{story:SEL,ticks:[...document.querySelectorAll('.rv')].map(x=>x.checked),approved:a});await load()}catch(e){alert(e.message)}}
async function act(w){try{const s=SEL;const r=await post('/api/dash/'+w,{story:s});await load()}catch(e){alert(e.message)}}
async function connect(){try{const r=await post('/api/yt/connect');location.href=r.url}catch(e){alert(e.message)}}
async function upload(dry){try{const r=await post('/api/yt/upload',{story:SEL,privacy:$('#priv').value,ackClaims:$('#ack').checked,dryRun:dry,confirm:!dry&&confirm('Upload "'+SEL+'" to the connected YouTube channel as '+$('#priv').value+'?')});if(dry){$('#ulog').style.display='';$('#ulog').textContent=JSON.stringify(r,null,1)}else{$('#ulog').style.display='';poll()}}catch(e){alert(e.message)}}
function render(){nav();$('#sub').textContent=D.keysPresent.read?'Research API key: present (never shown). ':'Research API key missing. ';$('#view').innerHTML=TAB==='week'?vWeek():TAB==='next'?vNext():TAB==='searches'?vSearches():vPublish()}
load().catch(e=>$('#view').textContent=e.message);
</script></body></html>
